<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LRO Mission Control</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: one phone-shaped game window.
   Layer 0 = animated space background (canvas #bg).
   Layer 1 = UI on top: HUD, step tracker, the animated procedure in the centre (canvas #cv),
             a coach bubble, and a control dock around it.
   Layer 2 = modals (briefing, results). */
:root{
  --space:#14103f; --space2:#2b1a7a; --ink:#0d0a2e;
  --yellow:#ffd23f; --pink:#ff4d8d; --cyan:#2ee6d6; --orange:#ff8a2b; --lime:#9be564; --lilac:#b69cff;
  --cream:#fff8e7; --panel:rgba(42,33,120,.97); --panel2:#3a2f9a; --deep:#241a6b;
  --font-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;box-sizing:border-box}
body{margin:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#0a0728 radial-gradient(circle at 30% 20%,#2b1a7a 0,#0a0728 60%);
  color:var(--cream);font-family:var(--font-body);font-weight:600;font-size:15px;line-height:1.35}
button{font-family:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%;max-width:480px;max-height:920px;overflow:hidden;background:var(--space);
  isolation:isolate;user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (min-width:520px) and (min-height:720px){
  #game{border:6px solid var(--ink);border-radius:36px;box-shadow:0 12px 0 var(--ink),0 30px 60px rgba(0,0,0,.5)}
}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.ui{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;gap:9px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{min-width:0}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:.02em;text-wrap:balance}

/* ---------- buttons ---------- */
.btn{font-family:var(--font-display);font-size:18px;letter-spacing:.02em;border:4px solid var(--ink);border-radius:18px;padding:10px 14px;
  background:var(--cyan);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;text-align:center;line-height:1.1;transition:transform .08s,box-shadow .08s,filter .15s}
.btn small{display:block;font-family:var(--font-body);font-weight:800;font-size:12px;margin-top:3px;opacity:.85}
.btn:active:not(:disabled),.btn.held{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
.btn.big{font-size:22px;padding:14px 16px}
.btn.hot{background:var(--orange)} .btn.pink{background:var(--pink);color:#fff} .btn.yellow{background:var(--yellow)} .btn.ok{background:var(--lime)}
.btn.glow{animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25) drop-shadow(0 0 8px #ffd23f)}}
:is(button,input):focus-visible{outline:4px solid var(--cyan);outline-offset:3px}
.rbtn{width:46px;height:46px;flex:none;border-radius:50%;border:4px solid var(--ink);background:var(--panel2);color:var(--cream);font-family:var(--font-display);font-size:22px;
  box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- HUD, tracker ---------- */
.hud{display:flex;align-items:center;gap:8px}
.hudtitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
.hudtitle small{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan)}
.hudtitle b{font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--yellow);text-shadow:0 3px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{flex:none;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:3px 12px;text-align:center;line-height:1}
.score small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.score b{font-family:var(--font-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.tracker{background:var(--panel);border:4px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:7px 12px 8px;display:flex;flex-direction:column;gap:5px}
.trkrow{display:flex;align-items:center}
.trk{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);background:var(--deep);color:#c9c1ff;display:flex;align-items:center;justify-content:center}
.trk i{font-style:normal;font-family:var(--font-display);font-size:15px;line-height:1}
.trk.now{background:var(--pink);color:#fff;animation:pulse 1s ease-in-out infinite alternate}
.trk.done{background:var(--lime);color:var(--ink)}
.trkline{flex:1;height:5px;background:var(--deep);border-radius:3px;margin:0 3px}
.trkline.done{background:var(--lime)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
#stepLabel{font-size:13px;line-height:1.15;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stepLabel b{color:var(--cyan);font-weight:800}

/* ---------- centre viewport ---------- */
.viewwrap{position:relative;flex:1 1 0;min-height:170px;border:5px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);overflow:hidden;background:var(--space)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner{position:absolute;left:10px;top:10px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--ink);pointer-events:none}
.banner.go{background:var(--lime);color:var(--ink)}
.skip{position:absolute;right:10px;top:8px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--ink);cursor:pointer}

/* ---------- coach + dock ---------- */
.coach{display:flex;gap:8px;align-items:flex-end}
.coach svg{flex:none;width:46px;height:46px;animation:bob 2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
#coach{flex:1;min-height:58px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:18px 18px 18px 4px;padding:7px 11px;font-size:13.5px;line-height:1.3;font-weight:700}
#coach b{font-weight:800}
#coach.good{background:#d8ffb3} #coach.bad{background:#ffd9b8}
.dock{background:var(--panel);border:4px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px}
.dock.locked{pointer-events:none;opacity:.8;filter:saturate(.8)}
.dock>*{min-width:0}

/* S1 */
.swrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swbtn{border:4px solid var(--ink);border-radius:16px;background:var(--panel2);box-shadow:0 4px 0 var(--ink);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:var(--font-display)}
.swbtn b{font-weight:400;font-size:17px;letter-spacing:.03em}
.swbtn small{font-family:var(--font-body);font-weight:800;font-size:12px;color:#d9d2ff}
.swbtn .lamp{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:var(--pink);box-shadow:0 0 0 0 rgba(255,77,141,.6);animation:lampp 1s infinite}
@keyframes lampp{0%{box-shadow:0 0 0 0 rgba(255,77,141,.7)}100%{box-shadow:0 0 0 10px rgba(255,77,141,0)}}
.swbtn.on{background:#3d7a2a}
.swbtn.on .lamp{background:var(--lime);animation:none}
.mbox{display:flex;flex-direction:column;gap:8px}
.mlabel{font-weight:800;font-size:13px;color:var(--cyan);text-transform:uppercase;letter-spacing:.06em}
.meter{position:relative;height:26px;border:4px solid var(--ink);border-radius:14px;background:var(--deep);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--lime)}
.meter .mark{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--pink);border:2px solid var(--ink);border-radius:4px}

/* S2 */
.gaugeL{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan);display:flex;justify-content:space-between}
.gauge{position:relative;height:26px;border:4px solid var(--ink);border-radius:14px;background:var(--deep);overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--lime)}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--pink);border:2px solid var(--ink);border-radius:4px}

/* S3 */
.orow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ro{background:var(--deep);border:3px solid var(--ink);border-radius:14px;padding:4px 6px;text-align:center;line-height:1.1}
.ro small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--cyan)}
.ro b{font-family:var(--font-display);font-weight:400;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ro.goal b{color:var(--yellow)}
.bbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fuel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--cyan)}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--lime)}
.pips i.off{background:var(--deep)}

/* S4 */
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ibtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;border:4px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);color:var(--ink);font-family:var(--font-display);font-size:14px;cursor:pointer;padding:3px 2px;line-height:1.05}
.ibtn svg{width:24px;height:24px}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn.hit{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.12)}}
.icount{display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px dashed #6f64d8;border-radius:14px;font-family:var(--font-display);font-size:20px;line-height:1;color:var(--yellow)}
.icount small{font-family:var(--font-body);font-size:11px;font-weight:800;color:var(--cream);letter-spacing:.06em;text-transform:uppercase}

/* S5 */
.mx{display:grid;grid-template-columns:40px repeat(4,minmax(0,1fr));gap:5px}
.mh{border:3px solid var(--ink);border-radius:11px;padding:3px 2px;text-align:center;color:var(--ink);line-height:1.05;display:flex;flex-direction:column;justify-content:center}
.mh b{font-family:var(--font-display);font-weight:400;font-size:13px}
.mh small{font-size:11px;font-weight:800}
.mr{border:3px solid var(--ink);border-radius:11px;background:var(--panel2);font-family:var(--font-display);font-size:18px;cursor:pointer;color:var(--cream);padding:0;min-height:38px}
.mr.sel{background:var(--yellow);color:var(--ink)}
.mc{border:3px solid var(--ink);border-radius:11px;background:var(--deep);color:#c9c1ff;font-family:var(--font-display);font-size:14px;cursor:pointer;min-height:38px;padding:0 2px;line-height:1}
.mc.ok{background:var(--lime);color:var(--ink)}
.mc.bad{background:var(--orange);color:var(--ink)}
.mc.sel{box-shadow:0 0 0 3px var(--yellow)}
.scanrow{display:flex;align-items:center;gap:8px}
.scanrow .btn{flex:1}
.scanrow .fuel{flex:none;flex-direction:column;gap:0;align-items:center;line-height:1.1;text-align:center}
.fuel b{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--yellow);letter-spacing:0}

/* ---------- screens + modals ---------- */
.screen{justify-content:center;align-items:center;text-align:center;gap:14px}
.logo{font-size:clamp(40px,12vw,56px);line-height:.95;color:var(--yellow);text-shadow:0 5px 0 var(--ink),0 0 30px rgba(255,210,63,.35)}
.logo span{display:block;color:var(--cyan);font-size:.62em}
.tag{max-width:320px;margin:0;font-size:15px}
.hero{width:150px;height:150px;animation:float 3s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-8px) rotate(-4deg)}to{transform:translateY(8px) rotate(4deg)}}
.maphead{display:flex;align-items:center;gap:10px;width:100%}
.maphead h2{flex:1;text-align:left;font-size:30px;color:var(--yellow);text-shadow:0 3px 0 var(--ink)}
.mapscroll{flex:1;min-height:0;width:100%;overflow-y:auto;padding:4px 2px 14px;display:flex;flex-direction:column;gap:12px}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:4px solid var(--ink);border-radius:22px;background:var(--panel);box-shadow:0 5px 0 var(--ink);padding:10px 12px;cursor:pointer;width:100%}
.node:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.node .nn{flex:none;width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);background:var(--pink);color:#fff;font-family:var(--font-display);font-size:24px;display:flex;align-items:center;justify-content:center}
.node.done .nn{background:var(--lime);color:var(--ink)}
.node .nt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.node .nt b{font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--yellow);line-height:1.05}
.node .nt small{font-size:12.5px;font-weight:700;color:#e6e0ff}
.starsrow{display:flex;gap:2px;flex:none}
.starsrow svg{width:22px;height:22px}
.modal{position:absolute;inset:0;z-index:5;background:rgba(10,7,40,.78);display:flex;align-items:center;justify-content:center;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-height:100%;overflow-y:auto;background:#2a2178;border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:11px}
.sheet h2{font-size:28px;color:var(--yellow);line-height:1.05}
.sheet .dt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--cyan)}
.sheet svg.art{width:100%;height:auto;display:block;border:4px solid var(--ink);border-radius:18px;background:#1b1550}
.sheet ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.sheet li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.3}
.sheet li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);font-style:normal;font-family:var(--font-display);font-size:14px;display:flex;align-items:center;justify-content:center}
.sheet li b{color:var(--yellow);font-weight:800}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.bigstars{display:flex;justify-content:center;gap:6px}
.bigstars svg{width:62px;height:62px}
.bigstars svg.pop{animation:starpop .5s both}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.rank{align-self:center;background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:999px;padding:4px 18px;font-family:var(--font-display);font-size:22px;box-shadow:0 4px 0 var(--ink)}
.pts{text-align:center;font-family:var(--font-display);font-size:20px;color:var(--yellow)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="game">
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- ========== PLAY SCREEN: HUD, tracker, centre animation, coach, dock ========== -->
  <div id="play" class="ui" hidden>
    <header class="hud">
      <button id="backBtn" class="rbtn" aria-label="Back to mission map"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="hudtitle"><small id="hudNum">Mission 1</small><b id="hudTitle">Launch Day</b></div>
      <button id="helpBtn" class="rbtn" aria-label="Show mission briefing">?</button>
      <div class="score"><small>Points</small><b id="score">0</b></div>
    </header>
    <div class="tracker" id="tracker" aria-label="Procedure steps">
      <div class="trkrow" id="trkrow"></div>
      <div id="stepLabel"></div>
    </div>
    <div class="viewwrap" id="viewWrap">
      <canvas id="cv" role="img" aria-label="Animated mission procedure"></canvas>
      <div id="banner" class="banner" hidden></div>
      <button id="skipDemo" class="skip" hidden>Skip demo</button>
    </div>
    <div class="coach">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="26" y="2" width="12" height="18" rx="3" fill="#ff4d8d" stroke="#0d0a2e" stroke-width="3"/><rect x="26" y="44" width="12" height="18" rx="3" fill="#ff4d8d" stroke="#0d0a2e" stroke-width="3"/><rect x="16" y="18" width="32" height="28" rx="8" fill="#ffd23f" stroke="#0d0a2e" stroke-width="3"/><circle cx="32" cy="32" r="7" fill="#fff8e7" stroke="#0d0a2e" stroke-width="3"/><circle cx="34" cy="32" r="3" fill="#0d0a2e"/><path d="M48 26a8 8 0 0 1 0 12z" fill="#2ee6d6" stroke="#0d0a2e" stroke-width="3" stroke-linejoin="round"/></svg>
      <div id="coach" role="status" aria-live="polite"></div>
    </div>
    <div class="dock" id="dock"></div>
  </div>

  <!-- ========== TITLE ========== -->
  <div id="title" class="ui screen">
    <svg class="hero" viewBox="0 0 64 64" aria-hidden="true"><rect x="26" y="2" width="12" height="18" rx="3" fill="#ff4d8d" stroke="#0d0a2e" stroke-width="3"/><rect x="26" y="44" width="12" height="18" rx="3" fill="#ff4d8d" stroke="#0d0a2e" stroke-width="3"/><rect x="16" y="18" width="32" height="28" rx="8" fill="#ffd23f" stroke="#0d0a2e" stroke-width="3"/><circle cx="32" cy="32" r="7" fill="#fff8e7" stroke="#0d0a2e" stroke-width="3"/><circle cx="34" cy="32" r="3" fill="#0d0a2e"/><path d="M48 26a8 8 0 0 1 0 12z" fill="#2ee6d6" stroke="#0d0a2e" stroke-width="3" stroke-linejoin="round"/></svg>
    <h1 class="logo">LRO<span>Mission Control</span></h1>
    <p class="tag">Fly NASA's Lunar Reconnaissance Orbiter. Launch it, catch it at the Moon, shape its orbit, map the surface and help pick a landing site.</p>
    <button id="playBtn" class="btn big pink" style="min-width:200px">PLAY</button>
  </div>

  <!-- ========== MISSION MAP ========== -->
  <div id="map" class="ui" hidden>
    <div class="maphead">
      <button id="mapBack" class="rbtn" aria-label="Back to title"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2>Mission Map</h2>
      <div class="score"><small>Points</small><b id="mapScore">0</b></div>
    </div>
    <div class="mapscroll" id="mapList"></div>
  </div>

  <!-- ========== MODALS ========== -->
  <div id="brief" class="modal" hidden><div class="sheet" id="briefSheet"></div></div>
  <div id="result" class="modal" hidden><div class="sheet" id="resultSheet"></div></div>
</div>

<script>
(function(){
'use strict';

/* =====================================================================
   CONTENT  -  CUSTOMIZE THE WORDS HERE
   Every string shown to the player lives in this block. Keep the same
   structure (keys, array order) and change only the text and numbers.
   ===================================================================== */
const CONTENT = {

  /* ---- The five missions. "steps" feed the step tracker, the coach bubble and the briefing.
         "learned" is shown on the results sheet. ---- */
  stages: [
    { short:'Launch', title:'Launch Day', date:'18 June 2009 · Cape Canaveral, Florida',
      steps:[
        {label:'Final checks',            detail:'Before any launch, engineers confirm fuel, weather and spacecraft health. Flip each switch to GO.'},
        {label:'Lift off',                detail:'The Atlas V rocket lights its engine. Press LIFT OFF while the marker is inside the green zone.'},

let clock=0;
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.8,p:Math.random()*6.28,c:[C.cream,C.yellow,C.cyan,C.pink][Math.floor(Math.random()*4)]}));
function skyBG(top,bot,starA){
  X=ctx; ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,view.h); g.addColorStop(0,top); g.addColorStop(1,bot); ctx.fillStyle=g; ctx.fillRect(0,0,view.w,view.h);
  if(starA>0){for(const s of stars){ctx.globalAlpha=starA*(reduce?.8:.55+.45*Math.sin(clock*2+s.p)); ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(s.x*view.w,s.y*view.h,s.r,0,6.283); ctx.fill();} ctx.globalAlpha=1;}

/* ---------- drawing helpers (use X) ---------- */
function rr(x,y,w,h,r){X.beginPath(); X.moveTo(x+r,y); X.arcTo(x+w,y,x+w,y+h,r); X.arcTo(x+w,y+h,x,y+h,r); X.arcTo(x,y+h,x,y,r); X.arcTo(x,y,x+w,y,r); X.closePath();}
function paint(fill,lw){X.fillStyle=fill; X.fill(); X.lineWidth=lw||4; X.strokeStyle=C.ink; X.lineJoin='round'; X.stroke();}
function text(s,x,y,size,color,align){X.font=size+"px 'Lilita One','Trebuchet MS',sans-serif"; X.textAlign=align||'left'; X.textBaseline='middle'; X.lineWidth=Math.max(3,size/5); X.strokeStyle=C.ink; X.lineJoin='round'; X.strokeText(s,x,y); X.fillStyle=color||C.cream; X.fillText(s,x,y);}
function circle(x,y,r,fill,lw){X.beginPath(); X.arc(x,y,r,0,6.283); paint(fill,lw);}
function drawMoon(cx,cy,r,lw){
  circle(cx,cy,r,C.moon,lw||6);
  [[-.35,-.25,.2],[.3,.05,.24],[-.05,.5,.15],[-.1,-.6,.11],[.55,-.4,.13],[-.6,.3,.13],[.45,.55,.1]].forEach(c=>circle(cx+c[0]*r,cy+c[1]*r,c[2]*r,C.crater,Math.max(2,r/22)));
}
function drawEarth(cx,cy,r){
  circle(cx,cy,r,'#3aa0ff',Math.max(3,r/9));
  X.fillStyle=C.lime; X.beginPath(); X.ellipse(cx-r*.3,cy-r*.2,r*.35,r*.25,.5,0,6.283); X.fill(); X.beginPath(); X.ellipse(cx+r*.35,cy+r*.35,r*.25,r*.2,-.4,0,6.283); X.fill();
  X.beginPath(); X.arc(cx,cy,r,0,6.283); X.lineWidth=Math.max(3,r/9); X.strokeStyle=C.ink; X.stroke();
}
function flame(len,wide){
  X.beginPath(); X.moveTo(0,-wide); X.quadraticCurveTo(-len*.7,-wide,-len,0); X.quadraticCurveTo(-len*.7,wide,0,wide); X.closePath(); paint(C.orange,3);
  X.beginPath(); X.moveTo(0,-wide*.55); X.quadraticCurveTo(-len*.45,-wide*.5,-len*.6,0); X.quadraticCurveTo(-len*.45,wide*.5,0,wide*.55); X.closePath(); X.fillStyle=C.yellow; X.fill();
}
/* LRO faces +x (dish at front, engine at back). open = solar panel unfold amount 0..1 */
function drawLRO(x,y,s,ang,fire,open){
  if(open==null)open=1; X.save(); X.translate(x,y); X.rotate(ang); X.scale(s,s);
  for(const sy of [-1,1]){X.save(); X.scale(1,Math.max(.1,open)); rr(-9,sy<0?-66:22,18,44,4); paint(C.pink,4); X.strokeStyle=C.ink; X.lineWidth=2; X.beginPath(); for(let i=1;i<4;i++){const yy=(sy<0?-66:22)+i*11; X.moveTo(-9,yy); X.lineTo(9,yy);} X.stroke(); X.restore();}
  X.beginPath(); X.moveTo(-22,-8); X.lineTo(-34,-13); X.lineTo(-34,13); X.lineTo(-22,8); X.closePath(); paint(C.orange,4);
  if(fire){X.save(); X.translate(-34,0); flame(46+Math.random()*14,11); X.restore();}
  rr(-24,-20,48,40,10); paint(C.yellow,4);
  X.beginPath(); X.arc(26,0,15,-Math.PI/2,Math.PI/2); X.closePath(); paint(C.cyan,4);
  circle(-2,0,9,C.cream,3); X.fillStyle=C.ink; X.beginPath(); X.arc(1,0,4,0,6.283); X.fill();
  X.restore();
}
/* Atlas V (first stage + fairing) or the Centaur upper stage alone */
function drawRocket(x,baseY,mode,fire,s){
  X.save(); X.translate(x,baseY); X.scale(s,s);
  if(mode==='full'){
    if(fire){X.save(); X.rotate(Math.PI/2); flame(60+Math.random()*25,16); X.restore();}
    X.beginPath(); X.moveTo(-24,-30); X.lineTo(-44,0); X.lineTo(-24,0); X.closePath(); paint(C.orange,4);
    X.beginPath(); X.moveTo(24,-30); X.lineTo(44,0); X.lineTo(24,0); X.closePath(); paint(C.orange,4);
    rr(-24,-150,48,150,6); paint(C.cream,4); X.fillStyle=C.cyan; X.fillRect(-22,-60,44,16); X.fillRect(-22,-110,44,10);
    X.beginPath(); X.moveTo(-24,-150); X.quadraticCurveTo(-24,-190,0,-212); X.quadraticCurveTo(24,-190,24,-150); X.closePath(); paint(C.pink,4);
    circle(0,-130,9,C.yellow,3);
  } else {
    if(fire){X.save(); X.rotate(Math.PI/2); flame(55+Math.random()*20,12); X.restore();}
    X.beginPath(); X.moveTo(-12,0); X.lineTo(-17,12); X.lineTo(17,12); X.lineTo(12,0); X.closePath(); paint(C.orange,3);
    rr(-20,-86,40,86,6); paint(C.cream,4); X.fillStyle=C.pink; X.fillRect(-18,-46,36,14);
  }

}
function burst(x,y,r,t){
  X.save(); X.translate(x,y); X.rotate(t);
  X.beginPath(); for(let i=0;i<16;i++){const a=i/16*6.283,rad=i%2?r*.55:r; X.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);} X.closePath(); paint(C.yellow,4);
  X.beginPath(); for(let i=0;i<12;i++){const a=i/12*6.283,rad=i%2?r*.3:r*.6; X.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);} X.closePath(); X.fillStyle=C.orange; X.fill();
  X.restore();
}
function arrow(x1,y1,x2,y2,color,w){
  const a=Math.atan2(y2-y1,x2-x1); X.lineCap='round';
  X.strokeStyle=C.ink; X.lineWidth=w+4; X.beginPath(); X.moveTo(x1,y1); X.lineTo(x2-Math.cos(a)*6,y2-Math.sin(a)*6); X.stroke();
  X.strokeStyle=color; X.lineWidth=w; X.beginPath(); X.moveTo(x1,y1); X.lineTo(x2-Math.cos(a)*6,y2-Math.sin(a)*6); X.stroke();
  X.beginPath(); X.moveTo(x2,y2); X.lineTo(x2-Math.cos(a-.5)*12,y2-Math.sin(a-.5)*12); X.lineTo(x2-Math.cos(a+.5)*12,y2-Math.sin(a+.5)*12); X.closePath(); paint(color,3);
}

const bgStars=Array.from({length:80},(_,i)=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.7,l:i%3,p:Math.random()*6.28,c:[C.cream,C.yellow,C.cyan,C.pink][i%4]}));
let bgMode='deep', comet={t:-1,x:0,y:0};
function blob(x,y,r,col){const g=bgx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); bgx.fillStyle=g; bgx.fillRect(x-r,y-r,r*2,r*2);}
function ringed(x,y,r,col){
  X.save(); X.translate(x,y); X.rotate(-.35);
  X.beginPath(); X.ellipse(0,0,r*1.9,r*.5,0,Math.PI,6.283); X.lineWidth=r*.22; X.strokeStyle=C.ink; X.stroke(); X.lineWidth=r*.12; X.strokeStyle=C.yellow; X.stroke();
  circle(0,0,r,col,Math.max(3,r/8));
  X.beginPath(); X.ellipse(0,0,r*1.9,r*.5,0,0,Math.PI); X.lineWidth=r*.22; X.strokeStyle=C.ink; X.stroke(); X.lineWidth=r*.12; X.strokeStyle=C.yellow; X.stroke();
  X.restore();
}
function drawBG(dt){
  if(BW<2)return; X=bgx; const c=bgx; c.setTransform(dprBG,0,0,dprBG,0,0);
  const g=c.createLinearGradient(0,0,0,BH); const pal={deep:['#1a1150','#3b1f8f'],earth:['#120e3a','#2b1a7a'],moon:['#14103f','#2b1a7a']}[bgMode]; g.addColorStop(0,pal[0]); g.addColorStop(1,pal[1]); c.fillStyle=g; c.fillRect(0,0,BW,BH);
  blob(BW*.15,BH*.22,BW*.8,'rgba(255,77,141,.20)'); blob(BW*.9,BH*.55,BW*.7,'rgba(46,230,214,.15)'); blob(BW*.4,BH*.9,BW*.6,'rgba(182,156,255,.16)');
  for(const s of bgStars){ if(!reduce)s.y=(s.y+dt*(.004+s.l*.007))%1; const a=reduce?.8:.5+.5*Math.sin(clock*1.8+s.p); c.globalAlpha=a; c.fillStyle=s.c; c.beginPath(); c.arc(s.x*BW,s.y*BH,s.r*(.7+s.l*.25),0,6.283); c.fill(); } c.globalAlpha=1;
  if(!reduce){ comet.t-=dt; if(comet.t<-6){comet={t:1.4,x:BW*(.3+Math.random()*.7),y:BH*(.05+Math.random()*.25)};} if(comet.t>0){const k=1.4-comet.t; c.strokeStyle='rgba(255,248,231,'+(comet.t/1.4)+')'; c.lineWidth=3; c.lineCap='round'; c.beginPath(); c.moveTo(comet.x-k*160,comet.y+k*60); c.lineTo(comet.x-k*160-40,comet.y+k*60+15); c.stroke();} }
  if(bgMode==='earth'){
    const r=BW*.95, cx=BW*.5, cy=BH+BW*.55;
    const gl=c.createRadialGradient(cx,cy,r*.9,cx,cy,r*1.12); gl.addColorStop(0,'rgba(120,200,255,.55)'); gl.addColorStop(1,'rgba(120,200,255,0)'); c.fillStyle=gl; c.fillRect(0,cy-r*1.2,BW,r*1.2);
    drawEarth(cx,cy,r); X.fillStyle=C.cream; for(const q of [[-.3,-.82,.09],[.15,-.9,.07],[.45,-.78,.08],[-.6,-.7,.06]]){X.beginPath(); X.ellipse(cx+q[0]*r,cy+q[1]*r,r*q[2]*1.6,r*q[2]*.55,0,0,6.283); X.fill();}
    X.beginPath(); X.arc(cx,cy,r,0,6.283); X.lineWidth=6; X.strokeStyle=C.ink; X.stroke();

  } else {
    ringed(BW*.8,BH*.14,22,C.orange); drawMoon(BW*.1,BH*.92,BW*.5,8); drawEarth(BW*.2,BH*.12,18);

function setStep(n,silent){

/* =====================================================================

const OCX=118, OCY=176, MR3=40, K3=.5;
const normA=a=>{a=a%(Math.PI*2); if(a>Math.PI)a-=Math.PI*2; if(a<-Math.PI)a+=Math.PI*2; return a;};

  init(){

    this.fuelEl=mk('div','fuel','<span>Fuel</span><div class="pips"></div>'); this.retry=mk('button','btn yellow','Refuel and try again'); this.retry.hidden=true; this.retry.addEventListener('click',()=>{this.init(); say('Fresh tanks. Burn only when the glowing zone lights up.');});

  },
  inZone(kind){const d=kind==='apo'?Math.abs(normA(this.theta-Math.PI)):Math.abs(normA(this.theta)); return d<CONFIG.orbit.zone;},

    // LRO overhead and scan beam
    const lx=180+Math.sin(this.t*.8)*40, ly=20;
    if(this.fx){const p=SITE_POS[this.fx.si], ins=CONTENT.instruments.find(x=>x.id===INSTR5[this.fx.ii]); X.globalAlpha=.7; X.fillStyle=ins.color; X.beginPath(); X.moveTo(lx-6,ly+10); X.lineTo(lx+6,ly+10); X.lineTo(p[0]+20,p[1]); X.lineTo(p[0]-20,p[1]); X.closePath(); X.fill(); X.globalAlpha=1; X.strokeStyle=ins.color; X.lineWidth=4; X.beginPath(); X.arc(p[0],p[1],14+this.fx.t*34,0,6.283); X.stroke(); text(INSTR5[this.fx.ii]+' scanning...',180,330,14,ins.color,'center');}
    drawLRO(lx,ly,.34,Math.PI/2,false);
    for(let i=0;i<4;i++){
      const p=SITE_POS[i], sel=this.sel===i; if(sel){X.strokeStyle=C.yellow; X.lineWidth=4; X.beginPath(); X.arc(p[0],p[1],21+(reduce?0:Math.sin(this.t*6)*2),0,6.283); X.stroke();}
      circle(p[0],p[1],15,sel?C.yellow:C.pink,4); text(CONTENT.sites[i].id,p[0],p[1]+1,18,sel?C.ink:C.cream,'center'); text(CONTENT.sites[i].name,p[0],p[1]+30,12,C.cream,'center');
    }
    if(this.landed){const p=SITE_POS[this.sel]; burst(p[0],p[1],26+Math.sin(this.t*10)*4,this.t); text('LANDED!',180,172,30,C.lime,'center');}
    if(this.stp===0&&!this.fx) text('Tap a grey box below to scan',180,330,13,C.yellow,'center');
  }
};
const STAGES=[S1,S2,S3,S4,S5];

    +T(266,168,14,'#ff4d8d','middle')+'3 Captured in orbit</text>'

  ()=>'<svg class="art" viewBox="0 0 320 190" role="img" aria-label="A stretched orbit with a low point and a high point, and the target near-circular orbit about 50 kilometres up">'

    +T(200,92,12.5,'#ffd23f','middle')+'goal: circle 50 km up</text>'
    +'<rect x="6" y="152" width="150" height="34" rx="10" fill="#ffd23f" stroke="#0d0a2e" stroke-width="3"/>'+T(81,166,12.5,'#0d0a2e','middle')+'Burn at HIGH point:</text>'+T(81,180,12.5,'#0d0a2e','middle',600)+'lifts the low point</text>'

  ()=>'<svg class="art" viewBox="0 0 320 190" role="img" aria-label="Four candidate landing sites A to D on the Moon and a checklist: flat, few boulders, ice nearby, not freezing">'

/* =====================================================================
   SCREENS, MODALS, FLOW
   ===================================================================== */
function showScreen(name){
  G.screen=name; for(const id of ['title','map','play'])$(id).hidden=id!==name;
  bgMode=name==='play'?(G.cur===0?'earth':'moon'):'deep';
  if(name==='play')sizeCV();
}
function buildMap(){
  const list=$('mapList'); list.innerHTML='';
  CONTENT.stages.forEach((st,i)=>{
    const b=mk('button','node'+(G.stars[i]>0?' done':''));
    const locked=i>G.unlocked; b.disabled=locked;
    b.innerHTML='<span class="nn">'+(G.stars[i]>0?'✓':(locked?'':(i+1)))+'</span><span class="nt"><b>'+st.title+'</b><small>'+st.date.split('·')[0].trim()+'</small></span><span class="starsrow">'+[0,1,2].map(k=>starSVG(k<G.stars[i])).join('')+'</span>';
    if(locked)b.querySelector('.nn').innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="#fff8e7" stroke="#0d0a2e" stroke-width="2.4"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#0d0a2e" stroke-width="2.6"/></svg>';
    b.setAttribute('aria-label','Mission '+(i+1)+': '+st.title+(locked?', locked':', '+G.stars[i]+' stars')); b.addEventListener('click',()=>openStage(i)); list.appendChild(b);
  });
  $('mapScore').textContent=total();
}
function openStage(i){
  G.cur=i; G.demo=false; showScreen('play'); const st=CONTENT.stages[i];
  $('hudNum').textContent='Mission '+(i+1); $('hudTitle').textContent=st.title; $('score').textContent=total(); buildTracker(i); cv.setAttribute('aria-label','Animated procedure for '+st.title);
  $('banner').hidden=true; $('skipDemo').hidden=true; dock.classList.remove('locked'); STAGES[i].init(); showBrief(i,false);
}
function showBrief(i,mid){
  const st=CONTENT.stages[i]; G.paused=true;
  $('briefSheet').innerHTML='<div><div class="dt">Mission '+(i+1)+' briefing · '+st.date+'</div><h2>'+st.title+'</h2></div>'+BRIEF_ART[i]()
    +'<ol>'+st.steps.map((s,k)=>'<li><i>'+(k+1)+'</i><span><b>'+s.label+'.</b> '+s.detail+'</span></li>').join('')+'</ol>'
    +'<div class="btnrow">'+(mid?'<button class="btn ok" id="bResume">Keep playing</button>':'')+'<button class="btn" id="bDemo">Watch the demo first</button>'+(mid?'':'<button class="btn pink" id="bPlay">I’ll fly it</button>')+'</div>';
  $('brief').hidden=false;
  $('bDemo').addEventListener('click',()=>begin(true));
  if($('bPlay'))$('bPlay').addEventListener('click',()=>begin(false));
  if($('bResume'))$('bResume').addEventListener('click',()=>{$('brief').hidden=true; G.paused=false;});
}
function begin(demo){
  $('brief').hidden=true; $('result').hidden=true; G.paused=false; G.demo=demo;
  if(!demo){G.pts[G.cur]=0; $('score').textContent=total();}
  dock.classList.toggle('locked',demo); const bn=$('banner'); bn.hidden=!demo; bn.className='banner'; bn.textContent='WATCH THE DEMO'; $('skipDemo').hidden=!demo;
  STAGES[G.cur].init(); setStep(0);
}
function finishStage(stars){
  if(G.demo){
    G.demo=false; const bn=$('banner'); bn.hidden=false; bn.className='banner go'; bn.textContent='YOUR TURN!'; $('skipDemo').hidden=true; dock.classList.remove('locked'); G.paused=true;
    const cur=G.cur; setTimeout(()=>{ if(G.screen==='play'&&G.cur===cur&&!G.demo&&G.paused&&$('brief').hidden&&$('result').hidden)begin(false); },1400); return;
  }
  G.stars[G.cur]=Math.max(G.stars[G.cur],stars); G.pts[G.cur]+=stars*100; $('score').textContent=total(); G.unlocked=Math.max(G.unlocked,Math.min(4,G.cur+1));
  G.paused=true; showResult(stars);
}
function showResult(stars){
  const i=G.cur, st=CONTENT.stages[i], last=i===4, totalStars=G.stars.reduce((a,b)=>a+b,0);
  let rank=CONTENT.ranks[0].name; CONTENT.ranks.forEach(r=>{if(totalStars>=r.min)rank=r.name;});
  $('resultSheet').innerHTML='<div style="text-align:center"><div class="dt">Mission '+(i+1)+' complete</div><h2>'+(last?'Mission accomplished!':st.title+' done!')+'</h2></div>'
    +'<div class="bigstars">'+[0,1,2].map(k=>starSVG(k<stars,k<stars?'pop':'').replace('class="pop"','class="pop" style="animation-delay:'+(k*.2)+'s"')).join('')+'</div>'
    +'<div class="pts">Points so far: '+total()+'</div>'+(last?'<div class="rank">Rank: '+rank+'</div>':'')
    +'<div class="dt">What you learned</div><ol>'+st.learned.map((t,k)=>'<li><i>'+(k+1)+'</i><span>'+t+'</span></li>').join('')+'</ol>'
    +'<div class="btnrow"><button class="btn yellow" id="rReplay">Replay</button>'+(last?'<button class="btn pink" id="rMap">Mission map</button>':'<button class="btn pink" id="rNext">Next mission</button>')+'</div>';
  $('result').hidden=false;
  $('rReplay').addEventListener('click',()=>{$('result').hidden=true; openStage(i);});
  if($('rNext'))$('rNext').addEventListener('click',()=>{$('result').hidden=true; openStage(i+1);});
  if($('rMap'))$('rMap').addEventListener('click',()=>{$('result').hidden=true; goMap();});
}
function goMap(){G.paused=true; G.demo=false; $('brief').hidden=true; $('result').hidden=true; buildMap(); showScreen('map');}

/* ---------- wiring ---------- */
$('playBtn').addEventListener('click',goMap);
$('mapBack').addEventListener('click',()=>showScreen('title'));
$('backBtn').addEventListener('click',goMap);
$('helpBtn').addEventListener('click',()=>{if(G.screen==='play')showBrief(G.cur,true);});
$('skipDemo').addEventListener('click',()=>begin(false));
cv.addEventListener('pointerdown',e=>{const S=STAGES[G.cur]; if(G.screen!=='play'||!S||!S.pointer||G.demo||G.paused)return; const r=cv.getBoundingClientRect(); S.pointer((e.clientX-r.left-view.ox)/view.s,(e.clientY-r.top-view.oy)/view.s);});
window.addEventListener('keydown',e=>{
  if(G.screen!=='play'||G.paused||G.demo)return;
  if(G.cur===1&&e.code==='Space'){e.preventDefault(); S2.hold=true; if(S2.btn)S2.btn.classList.add('held');}
  if(G.cur===3&&/^[1-7]$/.test(e.key))S4.pick(+e.key-1);
});
window.addEventListener('keyup',e=>{if(G.cur===1&&e.code==='Space'){S2.hold=false; if(S2.btn)S2.btn.classList.remove('held');}});

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt; drawBG(dt);
  if(G.screen==='play'&&G.cur>=0&&view.w>2&&view.h>2){
    const S=STAGES[G.cur]; if(!G.paused)S.update(dt*(G.demo?CONFIG.demoSpeed:1)); S.draw(dt);
  }
  requestAnimationFrame(frame);
}
sizeBG(); sizeCV(); showScreen('title');
requestAnimationFrame(frame);
})();
</script>
