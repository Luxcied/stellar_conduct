<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LRO Mission Control V5</title>
<meta name="color-scheme" content="dark light">
<script>/* apply the saved (or system) theme before first paint */
(function(){var t=null;try{t=JSON.parse(localStorage.getItem('lromc_theme'));}catch(e){}
if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout concept: one phone-shaped game window.
   Layer 0 = animated space background (canvas #bg).
   Layer 1 = UI on top: HUD, step tracker, the animated procedure in the centre (canvas #cv),
             a coach bubble, and a control dock around it.
   Layer 2 = modals (briefing, results). */
:root{
  --space:#14103f; --space2:#2b1a7a; --ink:#0d0a2e;
  --yellow:#ffd23f; --pink:#ff4d8d; --cyan:#2ee6d6; --orange:#ff8a2b; --lime:#9be564; --lilac:#b69cff;
  --cream:#fff8e7; --panel:rgba(42,33,120,.97); --panel2:#3a2f9a; --deep:#241a6b;
  --font-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito','Trebuchet MS',system-ui,sans-serif;
  /* V5 theme tokens (dark is the default look) */
  --text:#fff8e7; --muted:#c9c1ff; --sub:#e6e0ff; --accent:#2ee6d6; --head:#ffd23f;
  --sheet:#2a2178; --art:#1b1550; --ok-bg:#3d7a2a; --bad-bg:#b5473b; --half-bg:#a8801f;
  --glass:rgba(20,16,63,.72); --scrim:rgba(10,7,40,.78);
  --page:#0a0728 radial-gradient(circle at 30% 20%,#2b1a7a 0,#0a0728 60%);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --space:#cfe0ff; --space2:#e4d6ff;
  --panel:rgba(255,255,255,.96); --panel2:#e8e1ff; --deep:#d7cffb; --cream:#fffdf5;
  --text:#1d1650; --muted:#4a3fb0; --sub:#352b86; --accent:#0b7e77; --head:#b3205f;
  --sheet:#f5f1ff; --art:#e9e4ff; --ok-bg:#b9f08c; --bad-bg:#ffbfae; --half-bg:#ffe28f;
  --glass:rgba(255,255,255,.7); --scrim:rgba(40,28,110,.5);
  --page:#c9d6ff radial-gradient(circle at 30% 20%,#f2e8ff 0,#c9d6ff 60%);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;box-sizing:border-box}
body{margin:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:var(--page);
  color:var(--text);font-family:var(--font-body);font-weight:600;font-size:15px;line-height:1.35}
button{font-family:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#game{position:relative;width:100%;height:100%;max-width:480px;max-height:920px;overflow:hidden;background:var(--space);
  isolation:isolate;user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (min-width:520px) and (min-height:720px){
  #game{border:6px solid var(--ink);border-radius:36px;box-shadow:0 12px 0 var(--ink),0 30px 60px rgba(0,0,0,.5)}
}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.ui{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;gap:9px;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{min-width:0}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;letter-spacing:.02em;text-wrap:balance}

/* ---------- buttons ---------- */
.btn{font-family:var(--font-display);font-size:18px;letter-spacing:.02em;border:4px solid var(--ink);border-radius:18px;padding:10px 14px;
  background:var(--cyan);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;text-align:center;line-height:1.1;transition:transform .08s,box-shadow .08s,filter .15s}
.btn small{display:block;font-family:var(--font-body);font-weight:800;font-size:12px;margin-top:3px;opacity:.85}
.btn:active:not(:disabled),.btn.held{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:grayscale(.7) brightness(.7);cursor:not-allowed}
.btn.big{font-size:22px;padding:14px 16px}
.btn.hot{background:var(--orange)} .btn.pink{background:var(--pink);color:#fff} .btn.yellow{background:var(--yellow)} .btn.ok{background:var(--lime)}
.btn.glow{animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25) drop-shadow(0 0 8px #ffd23f)}}
:is(button,input):focus-visible{outline:4px solid var(--cyan);outline-offset:3px}
.rbtn{width:46px;height:46px;flex:none;border-radius:50%;border:4px solid var(--ink);background:var(--panel2);color:var(--text);font-family:var(--font-display);font-size:22px;
  box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- HUD, tracker ---------- */
.hud{display:flex;align-items:center;gap:8px}
.hudtitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
.hudtitle small{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.hudtitle b{font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--yellow);text-shadow:0 3px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{flex:none;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:3px 12px;text-align:center;line-height:1}
.score small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.score b{font-family:var(--font-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.tracker{background:var(--panel);border:4px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:7px 12px 8px;display:flex;flex-direction:column;gap:5px}
.trkrow{display:flex;align-items:center}
.trk{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);background:var(--deep);color:var(--muted);display:flex;align-items:center;justify-content:center}
.trk i{font-style:normal;font-family:var(--font-display);font-size:15px;line-height:1}
.trk.now{background:var(--pink);color:#fff;animation:pulse 1s ease-in-out infinite alternate}
.trk.done{background:var(--lime);color:var(--ink)}
.trkline{flex:1;height:5px;background:var(--deep);border-radius:3px;margin:0 3px}
.trkline.done{background:var(--lime)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
#stepLabel{font-size:13px;line-height:1.15;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stepLabel b{color:var(--accent);font-weight:800}

/* ---------- centre viewport ---------- */
.viewwrap{position:relative;flex:1 1 0;min-height:120px;border:5px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);overflow:hidden;background:var(--space)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.banner{position:absolute;left:10px;top:10px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--ink);pointer-events:none}
.banner.go{background:var(--lime);color:var(--ink)}
.skip{position:absolute;right:10px;top:8px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 12px;font-family:var(--font-display);font-size:15px;box-shadow:0 3px 0 var(--ink);cursor:pointer}

/* ---------- coach + dock ---------- */
.coach{display:flex;gap:8px;align-items:flex-end}
.coach svg{flex:none;width:46px;height:46px;animation:bob 2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
#coach{flex:1;min-height:58px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:18px 18px 18px 4px;padding:7px 11px;font-size:13.5px;line-height:1.3;font-weight:700}
#coach b{font-weight:800}
#coach.good{background:#d8ffb3} #coach.bad{background:#ffd9b8}
.dock{background:var(--panel);border:4px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);padding:10px;display:flex;flex-direction:column;gap:8px}
.dock.locked{pointer-events:none;opacity:.8;filter:saturate(.8)}
.dock>*{min-width:0}

/* S1 */
.swrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.swbtn{border:4px solid var(--ink);border-radius:16px;background:var(--panel2);box-shadow:0 4px 0 var(--ink);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:var(--font-display)}
.swbtn b{font-weight:400;font-size:17px;letter-spacing:.03em}
.swbtn small{font-family:var(--font-body);font-weight:800;font-size:12px;color:var(--muted)}
.swbtn .lamp{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink);background:var(--pink);box-shadow:0 0 0 0 rgba(255,77,141,.6);animation:lampp 1s infinite}
@keyframes lampp{0%{box-shadow:0 0 0 0 rgba(255,77,141,.7)}100%{box-shadow:0 0 0 10px rgba(255,77,141,0)}}
.swbtn.on{background:var(--ok-bg)}
.swbtn.on .lamp{background:var(--lime);animation:none}
.mbox{display:flex;flex-direction:column;gap:8px}
.mlabel{font-weight:800;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.meter{position:relative;height:26px;border:4px solid var(--ink);border-radius:14px;background:var(--deep);overflow:hidden}
.meter .zone{position:absolute;top:0;bottom:0;background:var(--lime)}
.meter .mark{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--pink);border:2px solid var(--ink);border-radius:4px}

/* S2 */
.gaugeL{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);display:flex;justify-content:space-between}
.gauge{position:relative;height:26px;border:4px solid var(--ink);border-radius:14px;background:var(--deep);overflow:hidden}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--lime)}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:var(--pink);border:2px solid var(--ink);border-radius:4px}

/* S3 */
.orow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ro{background:var(--deep);border:3px solid var(--ink);border-radius:14px;padding:4px 6px;text-align:center;line-height:1.1}
.ro small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
.ro b{font-family:var(--font-display);font-weight:400;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ro.goal b{color:var(--head)}
.bbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fuel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pips i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--lime)}
.pips i.off{background:var(--deep)}

/* S4 */
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ibtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:56px;border:4px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);color:var(--ink);font-family:var(--font-display);font-size:14px;cursor:pointer;padding:3px 2px;line-height:1.05}
.ibtn svg{width:24px;height:24px}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn.hit{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.12)}}
.icount{display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px dashed #6f64d8;border-radius:14px;font-family:var(--font-display);font-size:20px;line-height:1;color:var(--head)}
.icount small{font-family:var(--font-body);font-size:11px;font-weight:800;color:var(--text);letter-spacing:.06em;text-transform:uppercase}

/* S5 */
.mx{display:grid;grid-template-columns:40px repeat(4,minmax(0,1fr));gap:5px}
.mh{border:3px solid var(--ink);border-radius:11px;padding:3px 2px;text-align:center;color:var(--ink);line-height:1.05;display:flex;flex-direction:column;justify-content:center}
.mh b{font-family:var(--font-display);font-weight:400;font-size:13px}
.mh small{font-size:11px;font-weight:800}
.mr{border:3px solid var(--ink);border-radius:11px;background:var(--panel2);font-family:var(--font-display);font-size:18px;cursor:pointer;color:var(--text);padding:0;min-height:38px}
.mr.sel{background:var(--yellow);color:var(--ink)}
.mc{border:3px solid var(--ink);border-radius:11px;background:var(--deep);color:var(--muted);font-family:var(--font-display);font-size:14px;cursor:pointer;min-height:38px;padding:0 2px;line-height:1}
.mc.ok{background:var(--lime);color:var(--ink)}
.mc.bad{background:var(--orange);color:var(--ink)}
.mc.sel{box-shadow:0 0 0 3px var(--yellow)}
.scanrow{display:flex;align-items:center;gap:8px}
.scanrow .btn{flex:1}
.scanrow .fuel{flex:none;flex-direction:column;gap:0;align-items:center;line-height:1.1;text-align:center}
.fuel b{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--head);letter-spacing:0}

/* ---------- screens + modals ---------- */
.screen{justify-content:center;align-items:center;text-align:center;gap:14px}
.logo{font-size:clamp(40px,12vw,56px);line-height:.95;color:var(--yellow);text-shadow:0 5px 0 var(--ink),0 0 30px rgba(255,210,63,.35)}
.logo span{display:block;color:var(--accent);font-size:.62em}
.tag{max-width:320px;margin:0;font-size:15px}
.hero{width:150px;height:150px;animation:float 3s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-8px) rotate(-4deg)}to{transform:translateY(8px) rotate(4deg)}}
.maphead{display:flex;align-items:center;gap:10px;width:100%}
.maphead h2{flex:1;text-align:left;font-size:30px;color:var(--yellow);text-shadow:0 3px 0 var(--ink)}
.mapscroll{flex:1;min-height:0;width:100%;overflow-y:auto;padding:4px 2px 14px;display:flex;flex-direction:column;gap:12px}
.node{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:4px solid var(--ink);border-radius:22px;background:var(--panel);box-shadow:0 5px 0 var(--ink);padding:10px 12px;cursor:pointer;width:100%}
.node:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.node .nn{flex:none;width:46px;height:46px;border-radius:50%;border:4px solid var(--ink);background:var(--pink);color:#fff;font-family:var(--font-display);font-size:24px;display:flex;align-items:center;justify-content:center}
.node.done .nn{background:var(--lime);color:var(--ink)}
.node .nt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.node .nt b{font-family:var(--font-display);font-weight:400;font-size:21px;color:var(--head);line-height:1.05}
.node .nt small{font-size:12.5px;font-weight:700;color:var(--sub)}
.starsrow{display:flex;gap:2px;flex:none}
.starsrow svg{width:22px;height:22px}
.modal{position:absolute;inset:0;z-index:5;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:100%;max-height:100%;overflow-y:auto;background:var(--sheet);border:5px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:11px}
.sheet h2{font-size:28px;color:var(--head);line-height:1.05}
.sheet .dt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.sheet svg.art{width:100%;height:auto;display:block;border:4px solid var(--ink);border-radius:18px;background:var(--art)}
.sheet ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.sheet li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.3}
.sheet li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);font-style:normal;font-family:var(--font-display);font-size:14px;display:flex;align-items:center;justify-content:center}
.sheet li b{color:var(--head);font-weight:800}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
.bigstars{display:flex;justify-content:center;gap:6px}
.bigstars svg{width:62px;height:62px}
.bigstars svg.pop{animation:starpop .5s both}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.rank{align-self:center;background:var(--pink);color:#fff;border:4px solid var(--ink);border-radius:999px;padding:4px 18px;font-family:var(--font-display);font-size:22px;box-shadow:0 4px 0 var(--ink)}
.pts{text-align:center;font-family:var(--font-display);font-size:20px;color:var(--head)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =====================================================================
   v2 additions: panels, accounts, shop, tools, challenge, toast
   ===================================================================== */
.screen{overflow-y:auto;justify-content:flex-start}
.stack{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:44px 0 10px}
.toprow{position:absolute;top:12px;right:14px;left:14px;display:flex;justify-content:flex-end;gap:8px;align-items:center;z-index:2}
.chipbtn{display:flex;align-items:center;gap:7px;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:2px 12px 2px 3px;box-shadow:0 4px 0 var(--ink);font-family:var(--font-display);font-size:16px;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none;line-height:1}
.av.big{width:64px;height:64px;font-size:34px;border-width:4px}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%;max-width:380px}
.menu .btn{font-size:15px;padding:9px 4px}
.menu .btn span{display:block;font-size:20px;margin-bottom:2px}
.pbody{flex:1;min-height:0;width:100%;overflow-y:auto;padding:4px 2px 18px;display:flex;flex-direction:column;gap:12px}
.pbody>*{flex:none}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:4px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink);padding:12px;display:flex;flex-direction:column;gap:7px;text-align:left}
.card h3{font-size:20px;color:var(--head);line-height:1.1}
.card p{margin:0;font-size:13.5px;line-height:1.35}
.card ol,.card ul{margin:0;padding-left:20px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.card a{color:var(--accent)}
.card.prof{flex-direction:row;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{align-items:flex-start}
.pill{display:inline-block;background:var(--lilac);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:0 9px;font-size:11.5px;font-weight:800;align-self:flex-start;line-height:1.5}
.pill.pro{background:var(--pink);color:#fff}
.small{font-size:12px;opacity:.85;line-height:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:3px solid var(--ink);border-radius:999px;background:var(--panel2);color:var(--text);font-family:var(--font-display);font-size:14px;padding:3px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.chip.on{background:var(--yellow);color:var(--ink)}
.fld{width:100%;font:inherit;font-weight:700;padding:9px 11px;border:4px solid var(--ink);border-radius:14px;background:var(--cream);color:var(--ink)}
textarea.fld{resize:vertical;min-height:64px}
.lbl{font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-top:4px}
.formula{font-family:'Courier New',monospace;background:var(--ink);border:3px solid var(--lilac);border-radius:12px;padding:5px 9px;color:var(--yellow);font-size:13px;font-weight:700;text-align:left}
.btn.sm{font-size:14px;padding:6px 10px;box-shadow:0 3px 0 var(--ink);border-width:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.fld{flex:1;min-width:0}
.post{flex-direction:row;gap:10px;align-items:flex-start}
.post .pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.post .nm{font-family:var(--font-display);color:var(--head);font-size:17px}
.rep{border-left:4px solid var(--lilac);padding-left:8px;font-size:13px}
.sheet .how{margin:0;font-size:13.5px;line-height:1.3;background:var(--art);border:3px dashed var(--accent);border-radius:14px;padding:8px 10px}
.sheet .small{opacity:.8}

/* helper tools bar */
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tools.locked{pointer-events:none;opacity:.5}
.tbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px;border:4px solid var(--ink);border-radius:14px;background:var(--panel2);box-shadow:0 3px 0 var(--ink);padding:2px 3px;font-family:var(--font-display);font-size:13px;color:var(--text);cursor:pointer;line-height:1}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tbtn .ti{font-size:17px}
.tbtn .tn{display:none}
.tools.full{grid-template-columns:1fr 1fr}
.tools.full .tn{display:inline;white-space:nowrap}
.tools.full .tbtn{min-height:40px;font-size:14px}
@media (min-width:420px){.tbtn .tn{display:inline}}
.tbtn .cnt{position:absolute;top:-9px;right:-5px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:999px;font-size:11px;padding:1px 6px;line-height:1.1}
.tbtn.act{background:var(--lime);color:var(--ink)}
.tbtn.empty{filter:grayscale(.7) brightness(.8)}
.ibtn.dim{opacity:.25;filter:grayscale(.8)}
.ibtn.hinted{animation:glow .7s ease-in-out infinite alternate;outline:4px solid var(--yellow);outline-offset:2px}

/* mission challenge */
.qtype{font-weight:800;font-size:13px;color:var(--accent)}
.qtext{font-size:20px;line-height:1.2;color:var(--text);text-wrap:pretty}
.qopt{display:block;width:100%;text-align:left;border:4px solid var(--ink);border-radius:16px;background:var(--panel2);color:var(--text);box-shadow:0 4px 0 var(--ink);padding:10px 12px;font-family:var(--font-body);font-weight:800;font-size:14.5px;line-height:1.25;cursor:pointer;margin-bottom:8px}
.qopt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.qopt.ok{background:var(--ok-bg)}.qopt.bad{background:var(--bad-bg)}.qopt.half{background:var(--half-bg)}.qopt.gone{display:none}
.qopt:disabled{cursor:default}
.qrow{display:flex;gap:8px}.qrow .fld{flex:1;min-width:0}
.qfb{background:var(--ink);color:#fff8e7;border:3px dashed var(--yellow);border-radius:14px;padding:8px 10px;font-size:13.5px;line-height:1.3}
.qfb.good{border-color:var(--lime)}.qfb.bad{border-color:var(--orange)}.qfb.hint{border-color:var(--cyan)}
#qans{display:flex;flex-direction:column}

#toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,160px);max-width:90%;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:8px 14px;font-family:var(--font-display);font-size:16px;text-align:center;z-index:9;transition:transform .25s;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
.pbody::-webkit-scrollbar,.sheet::-webkit-scrollbar,.screen::-webkit-scrollbar{width:0}

/* =====================================================================
   v3 additions: Header/Footer proportions, Accessories, IG Chat, Calculator
   ===================================================================== */
#title.screen{justify-content:space-between;padding-block:14px}
.home-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:2}
.head-left{display:flex;gap:6px;align-items:center}
#title .toprow{position:static;display:flex;gap:6px;align-items:center}
#title .stack{margin:auto 0;padding:8px 0;gap:12px}
.home-foot{width:100%;z-index:2;background:var(--glass);border:4px solid var(--ink);border-radius:24px;padding:8px;box-shadow:0 5px 0 var(--ink);backdrop-filter:blur(4px)}
.home-foot .menu{grid-template-columns:repeat(4,1fr);max-width:100%;gap:7px}
.home-foot .menu .btn{font-size:13.5px;padding:8px 2px;border-radius:15px}
.home-foot .menu .btn span{font-size:19px;margin-bottom:2px}

/* Avatar accessories & profile themes */
.av{position:relative}
.av .hat{position:absolute;top:-11px;right:-6px;font-size:14px;line-height:1;filter:drop-shadow(0 2px 0 var(--ink));pointer-events:none}
.av.big .hat{top:-18px;right:-8px;font-size:26px}
.av.fr-gold{border-color:#ffd23f!important;box-shadow:0 0 0 3px var(--ink),0 0 12px #ffd23f}
.av.fr-neon{border-color:#2ee6d6!important;box-shadow:0 0 0 3px var(--ink),0 0 12px #2ee6d6}
.av.fr-pink{border-color:#ff4d8d!important;box-shadow:0 0 0 3px var(--ink),0 0 12px #ff4d8d}
.av.fr-super{border-color:#fff8e7!important;box-shadow:0 0 0 3px #ff4d8d,0 0 14px #ffd23f}
.card.th-nebula{background:linear-gradient(135deg,#2b1a7a,#5e239d,#14103f)!important}
.card.th-solar{background:linear-gradient(135deg,#7a1c1c,#b84a14,#3a2f9a)!important}
.card.th-cryo{background:linear-gradient(135deg,#0f4c5c,#1b3b6f,#241a6b)!important}
.card.th-nebula,.card.th-solar,.card.th-cryo,.card.th-cyber{color:#fff8e7}
.card.th-nebula h3,.card.th-solar h3,.card.th-cryo h3,.card.th-cyber h3{color:var(--yellow)}
.card.th-cyber{background:repeating-linear-gradient(45deg,#241a6b,#241a6b 10px,#31238c 10px,#31238c 20px)!important}

/* Instagram-style AstroPeers & Chat */
.ig-stories{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px}
.ig-story{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;flex:none;width:62px}
.ig-story .ring{padding:3px;border-radius:50%;background:linear-gradient(45deg,var(--yellow),var(--pink),var(--cyan));border:3px solid var(--ink)}
.ig-story small{font-size:11.5px;font-weight:800;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-box{display:flex;flex-direction:column;gap:8px;max-height:290px;overflow-y:auto;background:var(--deep);border:4px solid var(--ink);border-radius:18px;padding:10px}
.msg{max-width:82%;padding:7px 11px;border-radius:16px;border:3px solid var(--ink);font-size:13.5px;line-height:1.3;display:flex;flex-direction:column;gap:2px}
.msg.them{align-self:flex-start;background:var(--panel2);color:var(--text);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--cyan);color:var(--ink);border-bottom-right-radius:4px;font-weight:700}
.msg small{font-size:10px;opacity:.75}

/* Built-in Calculator */
.calc-box{background:var(--deep);border:4px solid var(--ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.calc-disp{background:var(--ink);color:var(--lime);border:3px solid var(--lilac);border-radius:10px;padding:6px 10px;font-family:'Courier New',monospace;font-size:16px;font-weight:800;text-align:right;min-height:36px;word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cbtn{border:3px solid var(--ink);border-radius:10px;background:var(--panel2);color:var(--text);font-family:var(--font-display);font-size:14px;padding:6px 2px;cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.cbtn:active{transform:translateY(2px);box-shadow:none}
.cbtn.op{background:var(--yellow);color:var(--ink)}
.cbtn.fn{background:var(--lilac);color:var(--ink);font-size:12px}
.cbtn.eq{background:var(--lime);color:var(--ink)}


/* =====================================================================
   V5 additions: header nav in Shop, top-up packs, comic mascot, theme + music controls,
   points-only results, and the larger Mission 5 view
   ===================================================================== */
.sec{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--head);margin:4px 0 0;text-align:left}
.score small,.score b{color:var(--ink)}

/* Shop: navigation bar in the header */
.shopnav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;padding:6px;background:var(--panel);border:4px solid var(--ink);border-radius:20px;box-shadow:0 4px 0 var(--ink)}
.snav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:50px;border:3px solid var(--ink);border-radius:14px;background:var(--panel2);color:var(--text);font-family:var(--font-display);font-size:14px;line-height:1.05;cursor:pointer;padding:4px 2px;box-shadow:0 3px 0 var(--ink)}
.snav span{font-size:19px;line-height:1}
.snav.on{background:var(--yellow);color:var(--ink)}
.snav:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card.wallet{align-items:flex-start}
.card.wallet h3{font-size:28px}
.pack{align-items:center}
.pack h3{font-size:22px}
.pack.hl{border-color:var(--pink)}
.pack .btn{align-self:flex-start}

/* map: points best-score badge replaces the old rating */
.bestpts{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:56px;line-height:1.05;text-align:center}
.bestpts b{font-family:var(--font-display);font-weight:400;font-size:20px;color:var(--head)}
.bestpts small{font-size:11px;font-weight:800;color:var(--sub)}
.utilbtns{display:flex;gap:6px;margin-left:auto}
.rbtn.sm{width:38px;height:38px;font-size:18px;border-width:3px}
.rbtn.big{width:54px;height:54px;font-size:22px}
.rbtn.on{background:var(--yellow)}

/* results sheet: points only */
.bigpts{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.bigpts b{font-family:var(--font-display);font-weight:400;font-size:56px;line-height:1;color:var(--head);animation:starpop .5s both}
.bigpts small{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.pill.ok{background:var(--lime)}
.brk{display:flex;flex-direction:column;gap:4px;background:var(--art);border:3px dashed var(--accent);border-radius:14px;padding:8px 10px}
.brk div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.brk b{font-family:var(--font-display);font-weight:400;font-size:15px}

/* utility column on home (theme + music) */
#title{position:absolute}
.utilcol{position:absolute;right:max(14px,env(safe-area-inset-right,0px));top:74px;display:flex;flex-direction:column;gap:8px;z-index:3}

/* mascot + comic text box */
.mascot{display:flex;flex-direction:column;align-items:center;gap:0;width:100%}
.mbtn{background:none;border:0;padding:0;cursor:pointer;line-height:0;border-radius:24px}
.mbtn .hero{width:120px;height:120px;display:block}
.mbtn.hop .hero{animation:hop .5s ease-out}
@keyframes hop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-22px) scale(1.12,.92)}70%{transform:translateY(0) scale(.94,1.08)}100%{transform:translateY(0) scale(1)}}
.comic{position:relative;max-width:min(330px,88%);min-height:64px;margin:0 0 16px;padding:12px 16px 12px;background:#fffdf0;color:#0d0a2e;border:4px solid var(--ink);border-radius:22px 26px 24px 20px;box-shadow:6px 6px 0 var(--ink);text-align:left;font-family:var(--font-display);font-size:16.5px;line-height:1.22;letter-spacing:.01em;overflow:visible;transform:rotate(-1.5deg)}
.comic::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background-image:radial-gradient(rgba(255,77,141,.28) 1.3px,transparent 1.6px);background-size:7px 7px;
  -webkit-mask-image:linear-gradient(115deg,transparent 55%,#000 100%);mask-image:linear-gradient(115deg,transparent 55%,#000 100%)}
.comic::after{content:"";position:absolute;left:46%;bottom:-19px;width:20px;height:20px;background:#fffdf0;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(50deg) skew(10deg,10deg);border-bottom-right-radius:6px}
.comic p{position:relative;margin:0}
.comic b{color:#d6246e;font-weight:400}
.comic .sfx{position:absolute;top:-17px;left:-12px;background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:1px 9px;font-size:13px;letter-spacing:.06em;transform:rotate(-8deg);box-shadow:3px 3px 0 var(--ink)}
.comic.pop{animation:comicpop .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes comicpop{0%{transform:rotate(-1.5deg) scale(.55);opacity:0}100%{transform:rotate(-1.5deg) scale(1);opacity:1}}
#title .stack{gap:10px}

/* playlist sheet */
.musichead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.np{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--art);border:3px dashed var(--accent);border-radius:16px;padding:10px}
.np small{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.np b{font-family:var(--font-display);font-weight:400;font-size:26px;color:var(--head)}
.musrow{display:flex;justify-content:center;align-items:center;gap:14px}
.rbtn.hero2{width:66px;height:66px;font-size:28px;background:var(--pink);color:#fff}
#musVol{width:100%;accent-color:var(--pink);height:28px}
.tracks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.trackbtn{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:3px solid var(--ink);border-radius:14px;background:var(--panel2);color:var(--text);box-shadow:0 3px 0 var(--ink);padding:7px 10px;font-family:var(--font-display);font-size:16px;cursor:pointer}
.trackbtn i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--cyan);color:var(--ink);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px}
.trackbtn.now{background:var(--yellow);color:var(--ink)}

/* Mission 5: give the picture the space (compact dock, tracker and coach) */
#play.m5{gap:6px;padding-block:8px}
#play.m5 .viewwrap{flex:1 1 0;min-height:150px}
#play.m5 .tracker{padding:4px 10px 5px;gap:3px}
#play.m5 .trk{width:22px;height:22px}
#play.m5 .coach svg{display:none}
#play.m5 #coach{min-height:40px;padding:5px 10px;font-size:13px;border-radius:16px}
#play.m5 .tools{gap:6px}
#play.m5 .tbtn{min-height:30px;border-width:3px}
#play.m5 .dock{padding:6px;gap:5px;border-radius:18px}
#play.m5 .mx{gap:4px;grid-template-columns:34px repeat(4,minmax(0,1fr))}
#play.m5 .mh{padding:2px 1px;border-radius:9px}
#play.m5 .mh b{font-size:12px}
#play.m5 .mh small{font-size:10px}
#play.m5 .mr,#play.m5 .mc{min-height:31px;border-radius:9px}
#play.m5 .btn.big{font-size:19px;padding:9px 12px}
@media (max-height:700px){#play.m5 .tracker #stepLabel{display:none} #play.m5 .coach svg{display:none} #play.m5 #coach{font-size:12.5px;min-height:34px}}

/* light mode: sticker outline so the yellow titles stay readable on pale backgrounds */
:root[data-theme="light"] .logo{-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
:root[data-theme="light"] .logo span{color:var(--cyan);-webkit-text-stroke:7px var(--ink)}
:root[data-theme="light"] .hudtitle b,:root[data-theme="light"] .maphead h2{-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
:root[data-theme="light"] .hudtitle small{color:#0b6f69}

</style>
</head>
<body>
<div id="game">
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- ========== PLAY SCREEN: HUD, tracker, centre animation, coach, tools, dock ========== -->
  <div id="play" class="ui" hidden>
    <header class="hud">
      <button id="backBtn" class="rbtn" aria-label="Back to mission map"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="hudtitle"><small id="hudNum">Mission 1</small><b id="hudTitle">Launch Day</b></div>
      <button id="helpBtn" class="rbtn" aria-label="How to play this mission">?</button>
      <div class="score"><small>Score</small><b id="score">0</b></div>
    </header>
    <div class="tracker" id="tracker" aria-label="Procedure steps">
      <div class="trkrow" id="trkrow"></div>
      <div id="stepLabel"></div>
    </div>
    <div class="viewwrap" id="viewWrap">
      <canvas id="cv" role="img" aria-label="Animated mission procedure"></canvas>
      <div id="banner" class="banner" hidden></div>
      <button id="skipDemo" class="skip" hidden>Skip demo</button>
    </div>
    <div class="coach">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="26" y="2" width="12" height="18" rx="3" fill="#ff4d8d" stroke="#0d0a2e" stroke-width="3"/><rect x="26" y="44" width="12" height="18" rx="3" fill="#ff4d8d" stroke="#0d0a2e" stroke-width="3"/><rect x="16" y="18" width="32" height="28" rx="8" fill="#ffd23f" stroke="#0d0a2e" stroke-width="3"/><circle cx="32" cy="32" r="7" fill="#fff8e7" stroke="#0d0a2e" stroke-width="3"/><circle cx="34" cy="32" r="3" fill="#0d0a2e"/><path d="M48 26a8 8 0 0 1 0 12z" fill="#2ee6d6" stroke="#0d0a2e" stroke-width="3" stroke-linejoin="round"/></svg>
      <div id="coach" role="status" aria-live="polite"></div>
    </div>
    <div class="tools" id="tools" aria-label="Helper tools"></div>
    <div class="dock" id="dock"></div>
  </div>

  <!-- ========== TITLE / HOME (Well-proportioned Header, Hero & Footer) ========== -->
  <div id="title" class="ui screen">
    <header class="home-head">
      <div class="head-left">
        <button class="btn sm" data-go="manual">📖 Guide</button>
        <button class="btn sm pink" data-go="pro">🚀 Go Pro</button>
      </div>
      <div class="toprow" id="titleTop"></div>
    </header>

    <div class="utilcol">
      <button class="rbtn sm" data-ui="theme" aria-label="Switch theme"></button>
      <button class="rbtn sm" data-ui="music" aria-label="Music"></button>
    </div>

    <div class="stack">
      <div class="mascot">
        <div class="comic" id="comic" role="status" aria-live="polite"><span class="sfx" id="comicSfx">HELLO!</span><p id="comicTxt"></p></div>
        <button class="mbtn" id="mascotBtn" aria-label="Tap Ro the mascot for another line">
          <svg class="hero" viewBox="0 0 64 64" aria-hidden="true"><rect x="26" y="2" width="12" height="18" rx="3" fill="#ff4d8d" stroke="#0d0a2e" stroke-width="3"/><rect x="26" y="44" width="12" height="18" rx="3" fill="#ff4d8d" stroke="#0d0a2e" stroke-width="3"/><rect x="16" y="18" width="32" height="28" rx="8" fill="#ffd23f" stroke="#0d0a2e" stroke-width="3"/><circle cx="32" cy="32" r="7" fill="#fff8e7" stroke="#0d0a2e" stroke-width="3"/><circle cx="34" cy="32" r="3" fill="#0d0a2e"/><path d="M48 26a8 8 0 0 1 0 12z" fill="#2ee6d6" stroke="#0d0a2e" stroke-width="3" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <h1 class="logo">LRO<span>Mission Control</span></h1>
      <p class="tag">Command the Mission, Shape the Discovery, By <b>STELLAR CONDUCT</b></p>
      <button class="btn big pink" data-go="play" style="min-width:210px">PLAY</button>
    </div>

    <footer class="home-foot">
      <div class="menu">
        <button class="btn yellow" data-go="library"><span>📚</span>Library</button>
        <button class="btn ok" data-go="peers"><span>👩‍🚀</span>AstroPeers</button>
        <button class="btn hot" data-go="shop"><span>🛒</span>Shop</button>
        <button class="btn yellow" data-go="profile"><span>🧑‍🚀</span>Profile</button>
      </div>
    </footer>
  </div>

  <!-- ========== MISSION MAP ========== -->
  <div id="map" class="ui" hidden>
    <div class="maphead">
      <button id="mapBack" class="rbtn" aria-label="Back to home"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2>Mission Map</h2>
      <button id="mapShop" class="rbtn" aria-label="Open the shop">🛒</button>
      <div class="score"><small>Points</small><b id="mapScore">0</b></div>
    </div>
    <div class="mapscroll" id="mapList"></div>
  </div>

  <!-- ========== GENERIC PANEL ========== -->
  <div id="panel" class="ui" hidden>
    <div class="maphead">
      <button id="panelBack" class="rbtn" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 id="panelTitle"></h2>
      <div class="score" id="panelScore" hidden><small>Points</small><b id="panelPts">0</b></div>
    </div>
    <nav class="shopnav" id="panelNav" aria-label="Section navigation" hidden></nav>
    <div class="pbody" id="panelBody"></div>
  </div>

  <!-- ========== MODALS ========== -->
  <div id="brief" class="modal" hidden><div class="sheet" id="briefSheet"></div></div>
  <div id="quiz" class="modal" hidden><div class="sheet" id="quizSheet"></div></div>

const game=$('game'), bgc=$('bg'), bgx=bgc.getContext('2d'), cv=$('cv'), ctx=cv.getContext('2d'), viewWrap=$('viewWrap');
let X=ctx;                                   // the context the drawing helpers use
let dprBG=1,BW=0,BH=0, dpr=1; const view={w:0,h:0,s:1,ox:0,oy:0};
function sizeBG(){const r=game.getBoundingClientRect(); dprBG=Math.min(2,window.devicePixelRatio||1); BW=r.width; BH=r.height; bgc.width=Math.max(1,Math.round(BW*dprBG)); bgc.height=Math.max(1,Math.round(BH*dprBG));}
function sizeCV(){const r=viewWrap.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1); view.w=r.width; view.h=r.height; cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr)); view.s=Math.min(r.width/VW,r.height/VH); view.ox=(r.width-VW*view.s)/2; view.oy=(r.height-VH*view.s)/2;}
function applyV(){ctx.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.ox,dpr*view.oy);}
window.addEventListener('resize',()=>{sizeBG();sizeCV();});
if(window.ResizeObserver){new ResizeObserver(()=>{sizeBG();sizeCV();}).observe(game); new ResizeObserver(sizeCV).observe(viewWrap);}
let clock=0;
const stars=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.8,p:Math.random()*6.28,c:[C.cream,C.yellow,C.cyan,C.pink][Math.floor(Math.random()*4)]}));
function skyBG(top,bot,starA){
  X=ctx; ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,view.h); g.addColorStop(0,top); g.addColorStop(1,bot); ctx.fillStyle=g; ctx.fillRect(0,0,view.w,view.h);
  const L=isLight(); if(L){ctx.fillStyle='rgba(205,222,255,.62)'; ctx.fillRect(0,0,view.w,view.h);}   // daylight veil
  if(starA>0){for(const s of stars){ctx.globalAlpha=starA*(reduce?.8:.55+.45*Math.sin(clock*2+s.p)); ctx.fillStyle=L?'#ffffff':s.c; ctx.beginPath(); ctx.arc(s.x*view.w,s.y*view.h,s.r,0,6.283); ctx.fill();} ctx.globalAlpha=1;}
  applyV();
}

/* ---------- drawing helpers (use X) ---------- */
function rr(x,y,w,h,r){X.beginPath(); X.moveTo(x+r,y); X.arcTo(x+w,y,x+w,y+h,r); X.arcTo(x+w,y+h,x,y+h,r); X.arcTo(x,y+h,x,y,r); X.arcTo(x,y,x+w,y,r); X.closePath();}
function paint(fill,lw){X.fillStyle=fill; X.fill(); X.lineWidth=lw||4; X.strokeStyle=C.ink; X.lineJoin='round'; X.stroke();}
function text(s,x,y,size,color,align){X.font=size+"px 'Lilita One','Trebuchet MS',sans-serif"; X.textAlign=align||'left'; X.textBaseline='middle'; X.lineWidth=Math.max(3,size/5); X.strokeStyle=C.ink; X.lineJoin='round'; X.strokeText(s,x,y); X.fillStyle=color||C.cream; X.fillText(s,x,y);}
function circle(x,y,r,fill,lw){X.beginPath(); X.arc(x,y,r,0,6.283); paint(fill,lw);}
function drawMoon(cx,cy,r,lw){
  circle(cx,cy,r,C.moon,lw||6);
  [[-.35,-.25,.2],[.3,.05,.24],[-.05,.5,.15],[-.1,-.6,.11],[.55,-.4,.13],[-.6,.3,.13],[.45,.55,.1]].forEach(c=>circle(cx+c[0]*r,cy+c[1]*r,c[2]*r,C.crater,Math.max(2,r/22)));
}
function drawEarth(cx,cy,r){
  circle(cx,cy,r,'#3aa0ff',Math.max(3,r/9));
  X.fillStyle=C.lime; X.beginPath(); X.ellipse(cx-r*.3,cy-r*.2,r*.35,r*.25,.5,0,6.283); X.fill(); X.beginPath(); X.ellipse(cx+r*.35,cy+r*.35,r*.25,r*.2,-.4,0,6.283); X.fill();
  X.beginPath(); X.arc(cx,cy,r,0,6.283); X.lineWidth=Math.max(3,r/9); X.strokeStyle=C.ink; X.stroke();
}
function flame(len,wide){
  X.beginPath(); X.moveTo(0,-wide); X.quadraticCurveTo(-len*.7,-wide,-len,0); X.quadraticCurveTo(-len*.7,wide,0,wide); X.closePath(); paint(C.orange,3);
  X.beginPath(); X.moveTo(0,-wide*.55); X.quadraticCurveTo(-len*.45,-wide*.5,-len*.6,0); X.quadraticCurveTo(-len*.45,wide*.5,0,wide*.55); X.closePath(); X.fillStyle=C.yellow; X.fill();
}
/* LRO faces +x (dish at front, engine at back). open = solar panel unfold amount 0..1 */
function drawLRO(x,y,s,ang,fire,open){
  if(open==null)open=1; X.save(); X.translate(x,y); X.rotate(ang); X.scale(s,s);
  for(const sy of [-1,1]){X.save(); X.scale(1,Math.max(.1,open)); rr(-9,sy<0?-66:22,18,44,4); paint(C.pink,4); X.strokeStyle=C.ink; X.lineWidth=2; X.beginPath(); for(let i=1;i<4;i++){const yy=(sy<0?-66:22)+i*11; X.moveTo(-9,yy); X.lineTo(9,yy);} X.stroke(); X.restore();}
  X.beginPath(); X.moveTo(-22,-8); X.lineTo(-34,-13); X.lineTo(-34,13); X.lineTo(-22,8); X.closePath(); paint(C.orange,4);
  if(fire){X.save(); X.translate(-34,0); flame(46+Math.random()*14,11); X.restore();}
  rr(-24,-20,48,40,10); paint(C.yellow,4);
  X.beginPath(); X.arc(26,0,15,-Math.PI/2,Math.PI/2); X.closePath(); paint(C.cyan,4);
  circle(-2,0,9,C.cream,3); X.fillStyle=C.ink; X.beginPath(); X.arc(1,0,4,0,6.283); X.fill();
  X.restore();
}
/* Atlas V (first stage + fairing) or the Centaur upper stage alone */
function drawRocket(x,baseY,mode,fire,s){
  X.save(); X.translate(x,baseY); X.scale(s,s);
  if(mode==='full'){
    if(fire){X.save(); X.rotate(Math.PI/2); flame(60+Math.random()*25,16); X.restore();}
    X.beginPath(); X.moveTo(-24,-30); X.lineTo(-44,0); X.lineTo(-24,0); X.closePath(); paint(C.orange,4);
    X.beginPath(); X.moveTo(24,-30); X.lineTo(44,0); X.lineTo(24,0); X.closePath(); paint(C.orange,4);
    rr(-24,-150,48,150,6); paint(C.cream,4); X.fillStyle=C.cyan; X.fillRect(-22,-60,44,16); X.fillRect(-22,-110,44,10);
    X.beginPath(); X.moveTo(-24,-150); X.quadraticCurveTo(-24,-190,0,-212); X.quadraticCurveTo(24,-190,24,-150); X.closePath(); paint(C.pink,4);
    circle(0,-130,9,C.yellow,3);
  } else {
    if(fire){X.save(); X.rotate(Math.PI/2); flame(55+Math.random()*20,12); X.restore();}
    X.beginPath(); X.moveTo(-12,0); X.lineTo(-17,12); X.lineTo(17,12); X.lineTo(12,0); X.closePath(); paint(C.orange,3);
    rr(-20,-86,40,86,6); paint(C.cream,4); X.fillStyle=C.pink; X.fillRect(-18,-46,36,14);
  }
  X.restore();
}
function burst(x,y,r,t){
  X.save(); X.translate(x,y); X.rotate(t);
  X.beginPath(); for(let i=0;i<16;i++){const a=i/16*6.283,rad=i%2?r*.55:r; X.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);} X.closePath(); paint(C.yellow,4);
  X.beginPath(); for(let i=0;i<12;i++){const a=i/12*6.283,rad=i%2?r*.3:r*.6; X.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);} X.closePath(); X.fillStyle=C.orange; X.fill();
  X.restore();
}
function arrow(x1,y1,x2,y2,color,w){
  const a=Math.atan2(y2-y1,x2-x1); X.lineCap='round';
  X.strokeStyle=C.ink; X.lineWidth=w+4; X.beginPath(); X.moveTo(x1,y1); X.lineTo(x2-Math.cos(a)*6,y2-Math.sin(a)*6); X.stroke();
  X.strokeStyle=color; X.lineWidth=w; X.beginPath(); X.moveTo(x1,y1); X.lineTo(x2-Math.cos(a)*6,y2-Math.sin(a)*6); X.stroke();
  X.beginPath(); X.moveTo(x2,y2); X.lineTo(x2-Math.cos(a-.5)*12,y2-Math.sin(a-.5)*12); X.lineTo(x2-Math.cos(a+.5)*12,y2-Math.sin(a+.5)*12); X.closePath(); paint(color,3);
}

function blob(x,y,r,col){const g=bgx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); bgx.fillStyle=g; bgx.fillRect(x-r,y-r,r*2,r*2);}
function ringed(x,y,r,col){
  X.save(); X.translate(x,y); X.rotate(-.35);
  X.beginPath(); X.ellipse(0,0,r*1.9,r*.5,0,Math.PI,6.283); X.lineWidth=r*.22; X.strokeStyle=C.ink; X.stroke(); X.lineWidth=r*.12; X.strokeStyle=C.yellow; X.stroke();
  circle(0,0,r,col,Math.max(3,r/8));
  X.beginPath(); X.ellipse(0,0,r*1.9,r*.5,0,0,Math.PI); X.lineWidth=r*.22; X.strokeStyle=C.ink; X.stroke(); X.lineWidth=r*.12; X.strokeStyle=C.yellow; X.stroke();
  X.restore();
}
function drawBG(dt){
  if(BW<2)return; X=bgx; const c=bgx; c.setTransform(dprBG,0,0,dprBG,0,0);
  const g=c.createLinearGradient(0,0,0,BH); const L=isLight(); const pal=(L?{deep:['#cfe3ff','#eadbff'],earth:['#bcd8ff','#dcd0ff'],moon:['#c8dcff','#e6d6ff']}:{deep:['#1a1150','#3b1f8f'],earth:['#120e3a','#2b1a7a'],moon:['#14103f','#2b1a7a']})[bgMode]; g.addColorStop(0,pal[0]); g.addColorStop(1,pal[1]); c.fillStyle=g; c.fillRect(0,0,BW,BH);
  blob(BW*.15,BH*.22,BW*.8,'rgba(255,77,141,.20)'); blob(BW*.9,BH*.55,BW*.7,'rgba(46,230,214,.15)'); blob(BW*.4,BH*.9,BW*.6,'rgba(182,156,255,.16)');
  for(const s of bgStars){ if(!reduce)s.y=(s.y+dt*(.004+s.l*.007))%1; const a=reduce?.8:.5+.5*Math.sin(clock*1.8+s.p); c.globalAlpha=L?a*.6:a; c.fillStyle=L?'#8a7be8':s.c; c.beginPath(); c.arc(s.x*BW,s.y*BH,s.r*(.7+s.l*.25),0,6.283); c.fill(); } c.globalAlpha=1;
  if(!reduce){ comet.t-=dt; if(comet.t<-6){comet={t:1.4,x:BW*(.3+Math.random()*.7),y:BH*(.05+Math.random()*.25)};} if(comet.t>0){const k=1.4-comet.t; c.strokeStyle=(L?'rgba(120,100,230,':'rgba(255,248,231,')+(comet.t/1.4)+')'; c.lineWidth=3; c.lineCap='round'; c.beginPath(); c.moveTo(comet.x-k*160,comet.y+k*60); c.lineTo(comet.x-k*160-40,comet.y+k*60+15); c.stroke();} }
  if(bgMode==='earth'){
    const r=BW*.95, cx=BW*.5, cy=BH+BW*.55;
    const gl=c.createRadialGradient(cx,cy,r*.9,cx,cy,r*1.12); gl.addColorStop(0,'rgba(120,200,255,.55)'); gl.addColorStop(1,'rgba(120,200,255,0)'); c.fillStyle=gl; c.fillRect(0,cy-r*1.2,BW,r*1.2);
    drawEarth(cx,cy,r); X.fillStyle=C.cream; for(const q of [[-.3,-.82,.09],[.15,-.9,.07],[.45,-.78,.08],[-.6,-.7,.06]]){X.beginPath(); X.ellipse(cx+q[0]*r,cy+q[1]*r,r*q[2]*1.6,r*q[2]*.55,0,0,6.283); X.fill();}
    X.beginPath(); X.arc(cx,cy,r,0,6.283); X.lineWidth=6; X.strokeStyle=C.ink; X.stroke();
    drawMoon(BW*.86,BH*.12,22,4);
  } else if(bgMode==='moon'){
    drawMoon(BW*.06,BH*1.04,BW*.72,8); drawEarth(BW*.86,BH*.13,30); ringed(BW*.16,BH*.1,15,C.pink);
  } else {
    ringed(BW*.8,BH*.14,22,C.orange); drawMoon(BW*.1,BH*.92,BW*.5,8); drawEarth(BW*.2,BH*.12,18);
  }
  X=ctx;
}

function addScore(v){
  if(G.demo)return;
  if(v<0&&G.shield){G.shield=false; renderTools(); toast('🛡️ Shield absorbed that mistake. No points lost!'); return;}
  if(v>0&&G.dbl)v*=2;
  G.pts[G.cur]=Math.max(0,G.pts[G.cur]+v); $('score').textContent=total();
}

function setStep(n,silent){
  G.stepIdx=n; const st=CONTENT.stages[G.cur];
  [...trkrow.querySelectorAll('.trk')].forEach((el,k)=>{el.classList.toggle('done',k<n); el.classList.toggle('now',k===n); el.firstChild.textContent=k<n?'✓':String(k+1);});
  [...trkrow.querySelectorAll('.trkline')].forEach((el,k)=>el.classList.toggle('done',k<n));
  const k=Math.min(n,st.steps.length-1), s=st.steps[k];
  $('stepLabel').innerHTML='<b>Step '+(k+1)+' of '+st.steps.length+'</b> · '+s.label;
  if(!silent&&n<st.steps.length) say((G.demo?'<b>Watch:</b> ':'')+s.detail);
}

const S1={
  init(){
    this.c=0; this.t=0; this.ev=0; this.gOff=0; this.sw=[0,0,0]; this.misses=0; this.m=.5; this.mt=0; this.zc=.5; this.cool=0; this.autoT=0; this.open=0; this.done=false; this.smoke=0;
    setStep(0); this.dockBuild();
  },
  dockBuild(){
    dock.innerHTML=''; const sw=mk('div','swrow');
    CONTENT.launch.checks.forEach((ck,i)=>{const b=mk('button','swbtn','<i class="lamp"></i><b>'+ck.label+'</b><small>'+ck.sub+'</small>'); b.addEventListener('click',()=>this.flip(i)); sw.appendChild(b);});
    const mb=mk('div','mbox'); mb.hidden=true;
    mb.innerHTML='<div class="mlabel"></div><div class="meter"><div class="zone"></div><div class="mark"></div></div>';
    const cmd=mk('button','btn big hot',''); cmd.addEventListener('click',()=>this.tap()); mb.appendChild(cmd);
    dock.append(sw,mb); this.swEl=sw; this.swBtns=[...sw.children]; this.mb=mb; this.zone=mb.querySelector('.zone'); this.mark=mb.querySelector('.mark'); this.cmd=cmd; this.mlabel=mb.querySelector('.mlabel');
  },
  hint(){
    if(this.c===0)return '<b>Hint:</b> tap all three lamps: FUEL, WEATHER and CRAFT.';
    if(this.c>=1&&this.c<=4)return '<b>Hint:</b> the pink marker swings side to side. Tap just as it crosses the green zone. The exact middle earns a bonus.';
    return null;
  },
  flip(i){
    if(this.c!==0||this.sw[i])return; this.sw[i]=1; this.swBtns[i].classList.add('on'); addScore(40);
    say(CONTENT.launch.checks[i].say,'good');
    if(this.sw.every(Boolean)) setTimeout(()=>{ if(this.c===0) this.advance(); },700);
  },
  advance(){
    this.c++; this.ev=0; this.cool=.9; this.open=this.c===5?0:this.open; setStep(this.c,this.c>=5);
    if(this.c>=1&&this.c<=4){
      const w=CONFIG.launch.zone; this.zc=.25+Math.random()*.5; this.mt=Math.random()*3; this.zone.style.left=((this.zc-w/2)*100)+'%'; this.zone.style.width=(w*100)+'%';
      const t=CONTENT.launch.timing[this.c-1]; this.mlabel.textContent=t.label; this.cmd.textContent=t.cmd; this.swEl.hidden=true; this.mb.hidden=false;
    } else { this.mb.hidden=true; }
  },
  tap(){
    if(this.c<1||this.c>4||this.cool>0||G.paused)return; const w=CONFIG.launch.zone, d=Math.abs(this.m-this.zc), t=CONTENT.launch.timing[this.c-1];
    if(d<=w/2){ const perfect=d<=w/6; addScore(100+(perfect?50:0)); this.advance(); say(t.ok+(perfect?' <b>Perfect timing!</b>':''),'good'); }
    else { this.misses++; this.cmd.classList.remove('shake'); void this.cmd.offsetWidth; this.cmd.classList.add('shake'); say(t.bad,'bad'); }
  },
  update(dt){
    this.t+=dt; this.ev+=dt; if(this.cool>0)this.cool-=dt;
    const tgt=[0,0,260,620,760,900][this.c]; this.gOff+=(tgt-this.gOff)*Math.min(1,dt*1.4);
    if(this.c>=1&&this.c<=4){this.mt+=dt; this.m=.5+.5*Math.sin(this.mt*CONFIG.launch.speed); this.mark.style.left=(this.m*100)+'%';}
    if(this.c===5) this.open=Math.min(1,this.open+dt*.9);
    if(G.demo){
      this.autoT+=dt;
      if(this.c===0&&this.autoT>.9){this.autoT=0; const i=this.sw.indexOf(0); if(i>=0)this.flip(i);}
      if(this.c>=1&&this.c<=4&&this.cool<=0&&Math.abs(this.m-this.zc)<.03) this.tap();
    }
    if(this.c===5&&!this.done&&this.ev>2.2){this.done=true; finishStage(this.misses<=1?3:this.misses<=3?2:1);}
  },
  draw(){
    const c=this.c, sky=clamp(this.gOff/520,0,1);
    skyBG(mixHex('#59c3ff','#14103f',sky),mixHex('#bfe9ff','#2b1a7a',sky),sky>.45?(sky-.45)/.55:0);
    const gy=292+this.gOff;
    if(gy<VH+130){
      X.beginPath(); X.moveTo(-300,gy); X.quadraticCurveTo(0,gy-30,180,gy-8); X.quadraticCurveTo(330,gy-28,700,gy); X.lineTo(700,gy+500); X.lineTo(-300,gy+500); X.closePath(); paint(C.lime,5);
      rr(105,gy-6,150,14,4); paint('#9aa3b8',4);
      rr(58,gy-150,22,150,3); paint(C.orange,4);
      X.strokeStyle=C.ink; X.lineWidth=3; X.beginPath(); for(let k=0;k<5;k++){X.moveTo(58,gy-136+k*28); X.lineTo(80,gy-110+k*28);} X.stroke();
      for(let i=0;i<3;i++){circle(69,gy-132+i*18,6,(this.sw[i]||c>=1)?C.lime:C.pink,3);}
      if(c===0) text('Switch each lamp to GO',200,gy-175,14,C.yellow,'center');
    }
    const lifted=Math.min(this.gOff,110);
    if(c<=2){
      if(c===2&&gy<VH+60){for(let k=0;k<6;k++){const a=(this.t*1.2+k/6)%1; X.globalAlpha=1-a; circle(180+(k%2?-1:1)*(16+a*60),gy-8-a*16,12+a*22,C.cream,3);} X.globalAlpha=1;}
      drawRocket(180,284-lifted,'full',c>=2,.75);
      if(c===1){const n=Math.floor((this.t*.9)%4); text(['T-3','T-2','T-1','GO!'][n],290,70,44,C.yellow,'center');}
    } else {
