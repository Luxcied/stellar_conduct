/* =====================================================================
   DYNAMIC STAGE UPDATES (ensures missions evolve & never stay the same)
   ===================================================================== */
G.levels=[1,1,1,1,1];
G.variant=1;

function applyStageUpdate(i){
  const lv=(G.levels&&G.levels[i])||1;
  if(i===0){
    CONFIG.launch.speed=+(1.85+Math.min(lv-1,5)*0.22+(Math.random()*0.2)).toFixed(2);
    CONFIG.launch.zone=Math.max(0.16,+(0.27-Math.min(lv-1,5)*0.018).toFixed(2));
  } else if(i===1){
    const low=30+Math.floor(Math.random()*22);
    const width=Math.max(14,22-Math.min(lv-1,4)*2);
    CONFIG.burn.startSpeed=95+Math.floor(Math.random()*15);
    CONFIG.burn.captureLow=low;
    CONFIG.burn.captureHigh=low+width;
  } else if(i===2){
    const goals=[40,50,60,70];
    const target=goals[(lv-1+Math.floor(Math.random()*goals.length))%goals.length];
    const periSteps=2, apoSteps=3+(lv%2);
    CONFIG.orbit.target=target;
    CONFIG.orbit.periStep=10;
    CONFIG.orbit.apoStep=38;
    CONFIG.orbit.startPeri=Math.max(15,target-periSteps*CONFIG.orbit.periStep);
    CONFIG.orbit.startApo=target+apoSteps*CONFIG.orbit.apoStep;
    CONFIG.orbit.fuel=periSteps+apoSteps+3;
  } else if(i===3){
    CONFIG.map.speed=46+Math.min(lv-1,5)*5;
    CONFIG.map.extra=1+Math.min(lv,5);
  } else if(i===4){
    const names=shuffle(['Smooth Plain','Frosty Crater','Sunny Rim','Boulder Field','Shackleton Edge','Cabeus Basin','Malapert Peak','Shoemaker Floor']);
    const winIdx=Math.floor(Math.random()*4);
    const flaws=shuffle(['slope','boulders','ice','temp']);
    CONTENT.sites.forEach((s,idx)=>{
      s.name=names[idx];
      if(idx===winIdx){
        s.slope=1+Math.floor(Math.random()*3);
        s.boulders='Few';
        s.ice='Rich';
        s.temp=-15-Math.floor(Math.random()*45);
      } else {
        s.slope=2+Math.floor(Math.random()*3);
        s.boulders='Few';
        s.ice='Rich';
        s.temp=-20-Math.floor(Math.random()*40);
        const f=flaws[idx%flaws.length];
        if(f==='slope')s.slope=7+Math.floor(Math.random()*6);
        else if(f==='boulders')s.boulders='Many';
        else if(f==='ice')s.ice=Math.random()<.5?'None':'Trace';
        else s.temp=-160-Math.floor(Math.random()*80);
      }
    });
  }
}

/* =====================================================================
   SCREENS, MODALS, FLOW
   ===================================================================== */
function showScreen(name){
  G.screen=name; for(const id of ['title','map','play','panel'])$(id).hidden=id!==name;
  bgMode=name==='play'?(G.cur===0?'earth':'moon'):'deep';
  if(typeof MASCOT!=='undefined')MASCOT.sync(name);
  if(name==='play')sizeCV(); else {G.paused=true; for(const id of ['brief','quiz','result'])$(id).hidden=true;}
}
function buildMap(){
  const list=$('mapList'); list.innerHTML='';
  const topBar=mk('div','row','<span class="pill">Stage Variant #'+G.variant+'</span><span class="utilbtns"><button class="rbtn sm" data-ui="music" aria-label="Music"></button><button class="rbtn sm" data-ui="theme" aria-label="Theme"></button></span><button class="btn sm yellow" id="regenMap">🔄 Update Stages</button>');
  list.appendChild(topBar);
  topBar.querySelector('#regenMap').addEventListener('click',()=>{
    G.variant++;
    G.levels=G.levels.map(l=>l+1);
    if(typeof persistProgress==='function')persistProgress();
    buildMap();
    if(typeof toast==='function')toast('🔄 All missions updated to new Stage Variants!');
  });
  CONTENT.stages.forEach((st,i)=>{
    const lv=(G.levels&&G.levels[i])||1;
    const done=G.stars[i]>0, best=G.best[i]||0;
    const b=mk('button','node'+(done?' done':''));
    const locked=i>G.unlocked; b.disabled=locked;
    b.innerHTML='<span class="nn">'+(done?'✓':(locked?'':(i+1)))+'</span><span class="nt"><b>'+st.title+' <span class="pill" style="font-size:11px;vertical-align:middle">Lv.'+lv+'</span></b><small>'+st.date.split('·')[0].trim()+' · Dynamic Stage</small></span><span class="bestpts">'+(done?'<b>'+(best||'✓')+'</b><small>'+(best?'best pts':'cleared')+'</small>':(locked?'':'<small>NEW</small>'))+'</span>';
    if(locked)b.querySelector('.nn').innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="#fff8e7" stroke="#0d0a2e" stroke-width="2.4"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#0d0a2e" stroke-width="2.6"/></svg>';
    b.setAttribute('aria-label','Mission '+(i+1)+': '+st.title+(locked?', locked':(best?', best score '+best+' points':(done?', cleared':', not played yet')))); b.addEventListener('click',()=>openStage(i)); list.appendChild(b);
  });
  $('mapScore').textContent=ME()?ME().points:0;
  if(typeof syncUI==='function')syncUI();
}
function openStage(i){
  G.cur=i; G.demo=false; G.pts=[0,0,0,0,0]; G.shield=false; G.dbl=false;
  applyStageUpdate(i);
  VH=(i===4)?372:340; $('play').classList.toggle('m5',i===4);   // Mission 5: larger, taller view
  showScreen('play'); renderTools(); $('tools').classList.remove('locked'); const st=CONTENT.stages[i];
  const lv=(G.levels&&G.levels[i])||1;
  $('hudNum').textContent='Mission '+(i+1)+' · Lv.'+lv; $('hudTitle').textContent=st.title; $('score').textContent=total(); buildTracker(i); cv.setAttribute('aria-label','Animated procedure for '+st.title);
  $('banner').hidden=true; $('skipDemo').hidden=true; dock.classList.remove('locked'); STAGES[i].init();
  if(i===2){const gGoal=dock.querySelector('.ro.goal b'); if(gGoal)gGoal.textContent=CONFIG.orbit.target+' × '+CONFIG.orbit.target+' km';}
  showBrief(i,false);
}
function showBrief(i,mid){
  const st=CONTENT.stages[i], lv=(G.levels&&G.levels[i])||1; G.paused=true;
  $('briefSheet').innerHTML='<div><div class="dt">Mission '+(i+1)+' (Stage Lv.'+lv+') · '+st.date+'</div><h2>'+st.title+'</h2></div>'+BRIEF_ART[i]()
    +'<p class="how"><b>How to play (Lv.'+lv+' Update):</b> '+st.how+'</p>'+'<ol>'+st.steps.map((s,k)=>'<li><i>'+(k+1)+'</i><span><b>'+s.label+'.</b> '+s.detail+'</span></li>').join('')+'</ol>'+'<div class="dt">Formula toolbox</div>'+st.formulas.map(f=>'<div class="formula">'+f+'</div>').join('')+'<div class="small">'+CONTENT.constants+'</div>'
    +'<div class="btnrow">'+(mid?'<button class="btn ok" id="bResume">Keep playing</button>':'')+'<button class="btn" id="bDemo">Watch the demo first</button>'+(mid?'':'<button class="btn pink" id="bPlay">I’ll fly it</button>')+'</div>';
  $('brief').hidden=false;
  $('bDemo').addEventListener('click',()=>begin(true));
  if($('bPlay'))$('bPlay').addEventListener('click',()=>begin(false));
  if($('bResume'))$('bResume').addEventListener('click',()=>{$('brief').hidden=true; G.paused=false;});
}
function begin(demo){
  $('brief').hidden=true; $('result').hidden=true; G.paused=false; G.demo=demo;
  if(!demo){G.pts[G.cur]=0; $('score').textContent=total();}
  dock.classList.toggle('locked',demo); $('tools').classList.toggle('locked',demo); const bn=$('banner'); bn.hidden=!demo; bn.className='banner'; bn.textContent='WATCH THE DEMO'; $('skipDemo').hidden=!demo;
  STAGES[G.cur].init();
  if(G.cur===2){const gGoal=dock.querySelector('.ro.goal b'); if(gGoal)gGoal.textContent=CONFIG.orbit.target+' × '+CONFIG.orbit.target+' km';}
  setStep(0);
}
function finishStage(stars){
  if(G.demo){
    G.demo=false; const bn=$('banner'); bn.hidden=false; bn.className='banner go'; bn.textContent='YOUR TURN!'; $('skipDemo').hidden=true; dock.classList.remove('locked'); $('tools').classList.remove('locked'); G.paused=true;
    const cur=G.cur; setTimeout(()=>{ if(G.screen==='play'&&G.cur===cur&&!G.demo&&G.paused&&$('brief').hidden&&$('result').hidden)begin(false); },1400); return;
  }
  const lv=(G.levels&&G.levels[G.cur])||1;
  G.stars[G.cur]=Math.max(G.stars[G.cur],stars); G.pts[G.cur]+=stars*100+(lv-1)*25; $('score').textContent=total();
  G.unlocked=Math.max(G.unlocked,Math.min(4,G.cur+1));
  G.levels[G.cur]=lv+1;
  G.paused=true; startChallenge(G.cur,stars);
}
function showResult(stars){
  const i=G.cur, st=CONTENT.stages[i], last=i===4, nextLv=(G.levels&&G.levels[i])||2;
  const prevBest=G.best[i]||0, run=G.pts[i], isBest=run>prevBest, chal=Q.earned||0;
  G.best[i]=Math.max(prevBest,run); persistProgress();
  const rank=rankFor(G.best.reduce((a,b)=>a+b,0)), verdict=['','Mission complete','Solid run','Flawless run'][stars]||'Mission complete';
  $('resultSheet').innerHTML='<div style="text-align:center"><div class="dt">Mission '+(i+1)+' complete · Stage upgraded to Lv.'+nextLv+'!</div><h2>'+(last?'Mission accomplished!':st.title+' done!')+'</h2></div>'
    +'<div class="bigpts"><span class="pill ok">'+verdict+'</span><b>+'+run+'</b><small>points banked</small>'+(isBest&&prevBest>0?'<span class="pill">New personal best!</span>':'')+'</div>'
    +'<div class="brk"><div><span>Flying and performance bonus</span><b>'+(run-chal)+' pts</b></div><div><span>Mission Challenge</span><b>'+(chal?'+'+chal:'0')+' pts</b></div><div><span>Wallet now</span><b>'+((ME()||{}).points||0)+' pts</b></div></div>'
    +(last?'<div class="rank">Rank: '+rank+'</div>':'')
    +'<div class="dt">What you learned</div><ol>'+st.learned.map((t,k)=>'<li><i>'+(k+1)+'</i><span>'+t+'</span></li>').join('')+'</ol>'
    +'<div class="btnrow"><button class="btn yellow" id="rReplay">Play Lv.'+nextLv+' Update</button>'+(last?'<button class="btn pink" id="rMap">Mission map</button>':'<button class="btn pink" id="rNext">Next mission</button>')+'</div>';
  $('result').hidden=false;
  $('rReplay').addEventListener('click',()=>{$('result').hidden=true; openStage(i);});
  if($('rNext'))$('rNext').addEventListener('click',()=>{$('result').hidden=true; openStage(i+1);});
  if($('rMap'))$('rMap').addEventListener('click',()=>{$('result').hidden=true; goMap();});
}
function goMap(){G.paused=true; G.demo=false; $('brief').hidden=true; $('result').hidden=true; $('quiz').hidden=true; buildMap(); showScreen('map');}

/* ---------- wiring ---------- */
$('backBtn').addEventListener('click',goMap);
$('helpBtn').addEventListener('click',()=>{if(G.screen==='play')showBrief(G.cur,true);});
$('skipDemo').addEventListener('click',()=>begin(false));
cv.addEventListener('pointerdown',e=>{const S=STAGES[G.cur]; if(G.screen!=='play'||!S||!S.pointer||G.demo||G.paused)return; const r=cv.getBoundingClientRect(); S.pointer((e.clientX-r.left-view.ox)/view.s,(e.clientY-r.top-view.oy)/view.s);});
window.addEventListener('keydown',e=>{
  if(G.screen!=='play'||G.paused||G.demo)return;
  if(G.cur===1&&e.code==='Space'){e.preventDefault(); S2.hold=true; if(S2.btn)S2.btn.classList.add('held');}
  if(G.cur===3&&/^[1-7]$/.test(e.key))S4.pick(+e.key-1);
});
window.addEventListener('keyup',e=>{if(G.cur===1&&e.code==='Space'){S2.hold=false; if(S2.btn)S2.btn.classList.remove('held');}});

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt; drawBG(dt);
  if(G.screen==='play'&&G.cur>=0&&view.w>2&&view.h>2){
    const S=STAGES[G.cur]; if(!G.paused)S.update(dt*(G.demo?CONFIG.demoSpeed:1)); S.draw(dt);
  }
  requestAnimationFrame(frame);
}
sizeBG(); sizeCV(); showScreen('title');
requestAnimationFrame(frame);

</script>
<script>
/* Mission Challenge question generators.
   Each mission has a pool. Numbers are randomised on every play, answer options are shuffled,
   and "think" questions have several acceptable answers (scored by how good the trade-off is). */
const QM={R:1737.4,GM:4902.8,C:299792.458,g0:9.80665,EM:384400};
function rnd(a,b,step){step=step||1; const n=Math.floor((b-a)/step+1e-9); return +(a+Math.floor(Math.random()*(n+1))*step).toFixed(6);}
function pick(a,n){return shuffle(a).slice(0,n);}
const rd=(x,d)=>+x.toFixed(d==null?2:d);
const commas=n=>n.toLocaleString('en-US');
const vCirc=h=>Math.sqrt(QM.GM/(QM.R+h));                                   // km/s
const periodMin=a=>2*Math.PI*Math.sqrt(Math.pow(a,3)/QM.GM)/60;             // minutes, a = semi-major axis (km)

function Qmc(q,correct,wrongs,extra){return Object.assign({type:'mc',q,options:shuffle([{t:correct,ok:true}].concat(pick(wrongs,3).map(t=>({t}))))},extra);}
function Qcalc(q,answer,unit,extra){return Object.assign({type:'calc',q,answer,unit,tol:0.02},extra);}
function Qthink(q,options,extra){return Object.assign({type:'think',q,options:shuffle(options)},extra);}

const instrQ=()=>{
  const ins=pick(CONTENT.instruments,1)[0], others=CONTENT.instruments.filter(x=>x!==ins).map(x=>x.id);
  return Math.random()<.5
   ?Qmc('Which LRO instrument is the '+ins.short.toLowerCase()+'?',ins.id,others,{hint:'It '+ins.does.charAt(0).toLowerCase()+ins.does.slice(1),explain:ins.id+': '+ins.does})
   :Qmc('Which instrument does this job? "'+ins.does+'"',ins.id,others,{hint:'Think of the instrument described as the '+ins.short.toLowerCase()+'.',explain:ins.id+' is the '+ins.short.toLowerCase()+'.'});
};

const QPOOLS=[
 /* ---------- Mission 1: Launch ---------- */
 [
  ()=>{const ve=rnd(3.0,4.4,0.1),m0=rnd(300,340,5),mf=rnd(100,140,5);
    return Qcalc('A rocket stage has exhaust speed '+ve+' km/s. It starts at '+m0+' tonnes and burns down to '+mf+' tonnes. What Δv does it gain? (km/s, 2 decimals)',ve*Math.log(m0/mf),'km/s',{hint:'Take the natural log (ln) of the mass ratio m0 ÷ mf, then multiply by ve.',formula:'Δv = ve × ln(m0 ÷ mf)'});},
  ()=>{const T=rnd(3800,4200,50),m=rnd(310,340,5);
    return Qcalc('Liftoff thrust is '+commas(T)+' kN and the loaded rocket has a mass of '+m+' tonnes. What is the thrust-to-weight ratio? (2 decimals, g = 9.81 m/s²)',T*1000/(m*1000*9.81),'',{hint:'Weight = mass in kg × 9.81. Convert kN to N and tonnes to kg first.',formula:'TWR = thrust ÷ (m × g)'});},
  ()=>Qmc('Which rocket launched LRO?','Atlas V',['Saturn V','Falcon 9','Space Shuttle','Ariane 5','Delta II'],{hint:'It carried LRO and LCROSS together.',explain:'LRO launched on an Atlas V rocket with a Centaur upper stage.'}),
  ()=>Qmc('Which companion probe shared LRO\'s ride to the Moon?','LCROSS',['Apollo 17','Clementine','Chandrayaan-1','GRAIL'],{hint:'It was built to hit a crater and look for water.',explain:'LCROSS launched with LRO and later hit the crater Cabeus.'}),
  ()=>Qmc('LRO launched on 18 June of which year?','2009',['2005','2007','2011','2013','2001'],{hint:'The very end of the 2000s.',explain:'LRO launched on 18 June 2009.'}),
  ()=>Qthink('Lightning is forecast near the pad and the launch window closes in 20 minutes. What do you do?',[
    {t:'Launch anyway. The schedule matters most.',score:0,fb:'Risky! Weather rules protect the rocket. A lost mission costs far more than a delay.'},
    {t:'Scrub and try the next launch window.',score:3,fb:'Safe and sensible. A delay is cheap compared with losing the spacecraft.'},
    {t:'Wait 15 minutes, keep monitoring, then decide.',score:2,fb:'Reasonable: you keep your options open, but you may run out of window.'},
    {t:'Ask engineers to waive the weather limit.',score:1,fb:'Limits exist for a reason. A waiver needs strong evidence.'}],{hint:'There are usually more launch windows later.'}),
  ()=>Qthink('You have 40 kg of spare mass allowance. How do you use it?',[
    {t:'Extra fuel for orbit maintenance.',score:3,fb:'More fuel means a longer mission. Excellent trade-off.'},
    {t:'Keep it as safety margin.',score:2,fb:'Margin protects against surprises, but unused mass is a missed chance.'},
    {t:'An extra small camera.',score:1,fb:'Nice science, but it needs power and data capacity you may not have.'},
    {t:'A decorative paint job.',score:0,fb:'Paint adds mass with no science value. Engineers say no!'}],{hint:'What limits how long the mission can last?'})
 ],
 /* ---------- Mission 2: Moon capture ---------- */
 [
  ()=>{const v=rnd(3000,4000,100);
    return Qcalc('The Earth–Moon distance is about 384,400 km. If LRO averages '+commas(v)+' km/h, how many DAYS does the trip take? (2 decimals)',QM.EM/(v*24),'days',{hint:'Hours = distance ÷ speed. Then divide by 24.',formula:'time = distance ÷ speed'});},
  ()=>{const d=rnd(363300,405500,100);
    return Qcalc('The Moon is '+commas(d)+' km away. How long does a radio signal take one way? (seconds, 2 decimals, c = 299,792 km/s)',d/QM.C,'s',{hint:'Time = distance ÷ the speed of light.',formula:'delay = distance ÷ c'});},
  ()=>{const h=rnd(30,200,10);
    return Qcalc('What is the circular orbital speed at '+h+' km altitude above the Moon? (km/s, 3 decimals)',vCirc(h),'km/s',{tol:0.01,hint:'r = 1737.4 + '+h+'. Then v = √(4902.8 ÷ r).',formula:'v = √(GM ÷ r)'});},
  ()=>{const h=rnd(50,100,10),vin=rnd(2.4,2.6,0.05);
    return Qcalc('LRO arrives at '+vin+' km/s near '+h+' km altitude and must slow to a circular orbit. What Δv must the engine remove? (km/s, 3 decimals)',vin-vCirc(h),'km/s',{tol:0.02,hint:'Find the circular speed there first, then subtract it from the arrival speed.',formula:'Δv = v_arrival − √(GM ÷ r)'});},
  ()=>Qmc('About how long did LRO take to reach the Moon?','About 4.5 days',['About 1 day','About 12 days','About 3 months','About 1 hour'],{hint:'Apollo took about 3 days; LRO was a little slower.',explain:'LRO launched on 18 June and reached the Moon on 23 June 2009.'}),
  ()=>Qmc('Why does LRO burn its engine AGAINST its direction of travel at the Moon?','To slow down so lunar gravity can capture it',['To speed up and escape','To face the Sun','To save fuel','To land softly'],{hint:'Arriving too fast means a flyby.',explain:'Braking lets lunar gravity hold on to the spacecraft.'}),
  ()=>Qthink('Mid-course correction: when do you fire the thrusters?',[
    {t:'Early: a small Δv, with plenty of time to re-check.',score:3,fb:'Early corrections cost less fuel and leave time to fix mistakes.'},
    {t:'Late: we will know exactly where we are.',score:1,fb:'Better knowledge helps, but late corrections burn more fuel.'},
    {t:'Skip it and hope for the best.',score:0,fb:'Small errors grow over 384,000 km.'},
    {t:'Split it into two smaller burns.',score:3,fb:'Great: a second burn can fix errors from the first.'}]),
  ()=>Qthink('The braking burn happens behind the Moon, out of contact with Earth. What is your plan?',[
    {t:'Pre-program the burn and add safety checks.',score:3,fb:'Tested, automatic sequences are how real missions handle a radio blackout.'},
    {t:'Wait for a live command from Earth.',score:0,fb:'You cannot receive commands behind the Moon.'},
    {t:'Do a shorter first burn, then check the result.',score:2,fb:'Cautious, but time and geometry limit extra burns.'},
    {t:'Burn early, before the geometry is right.',score:0,fb:'Wrong place means a wrong orbit, or a crash.'}]),
  ()=>Qthink('Fuel is slightly lower than planned at arrival. What do you do?',[
    {t:'Capture into a looser, more elongated orbit first.',score:3,fb:'A looser orbit costs less fuel and you can tighten it later. Creative and efficient.'},
    {t:'Skip the capture burn.',score:0,fb:'Without capture, LRO flies past the Moon.'},
    {t:'Switch off the science instruments to save fuel.',score:1,fb:'Instruments do not use fuel, so that is the wrong lever.'},
    {t:'Burn exactly as planned and replan later.',score:2,fb:'Safe, but you may regret not using the flexibility.'}])
 ],
 /* ---------- Mission 3: Orbit shaping ---------- */
 [
  ()=>{const hp=rnd(30,60,5),ha=rnd(150,220,10);
    return Qcalc('LRO flies a stretched orbit '+hp+' km at the low point and '+ha+' km at the high point. What is its semi-major axis a, measured from the Moon\'s centre? (km, 1 decimal, Moon radius 1737.4 km)',QM.R+(hp+ha)/2,'km',{tol:0.005,hint:'Average the two altitudes, then add the Moon\'s radius.',formula:'a = R + (low + high) ÷ 2'});},
  ()=>{const hp=rnd(30,50,10),ha=rnd(180,220,12),a=QM.R+(hp+ha)/2;
    return Qcalc('For an orbit '+hp+' km × '+ha+' km above the Moon, what is the orbital period in MINUTES? (1 decimal; use a = 1737.4 + (low + high) ÷ 2 and GM = 4902.8)',periodMin(a),'min',{tol:0.02,hint:'Compute a, then T = 2π√(a³ ÷ 4902.8) in seconds. Divide by 60.',formula:'T = 2π √(a³ ÷ GM)'});},
  ()=>{const h=rnd(30,200,10);
    return Qcalc('What is the period (minutes) of a CIRCULAR orbit '+h+' km above the Moon? (1 decimal)',periodMin(QM.R+h),'min',{tol:0.02,hint:'r = 1737.4 + '+h+', then T = 2π√(r³ ÷ 4902.8) seconds, ÷ 60.',formula:'T = 2π √(r³ ÷ GM)'});},
  ()=>{const gen=rnd(1500,1900,50),bus=rnd(600,900,50),ins=rnd(200,500,50);
    return Qcalc('Game numbers: the solar arrays make '+gen+' W, the spacecraft bus uses '+bus+' W and the instruments '+ins+' W. How many watts are left over?',gen-bus-ins,'W',{tol:0.001,hint:'Subtract everything that uses power from what is generated.',formula:'surplus = P_gen − P_bus − P_instruments'});},
  ()=>Qmc('Roughly what size was LRO\'s first (commissioning) orbit?','About 30 × 216 km',['About 5 × 50 km','About 1,000 × 5,000 km','About 400 km circular','About 36,000 km circular'],{hint:'Low at one end, higher at the other.',explain:'LRO first flew an elongated orbit about 30 km by 216 km before the near-circular 50 km orbit.'}),
  instrQ,
  ()=>Qthink('Power is limited. How do you switch on the instruments?',[
    {t:'A few at a time, verifying each one.',score:3,fb:'Staged checkout is standard practice.'},
    {t:'Everything at once.',score:1,fb:'You might trip a power fault.'},
    {t:'Only the camera, and ignore the rest.',score:1,fb:'Too narrow: other sensors may reveal problems.'},
    {t:'Safety-critical ones first, science later.',score:3,fb:'Mission priorities guide the order.'}]),
  ()=>Qthink('The laser altimeter shows slightly noisy data. What now?',[
    {t:'Check its calibration against known terrain.',score:3,fb:'Reference targets are a great test.'},
    {t:'Ignore it. Noise is normal.',score:1,fb:'Some noise is normal, but always check.'},
    {t:'Shut it down for the rest of the mission.',score:0,fb:'Far too drastic.'},
    {t:'Compare it with another instrument\'s data.',score:3,fb:'Cross-checking is smart science.'}])
 ],
 /* ---------- Mission 4: Mapping run ---------- */
 [
  ()=>{const h=rnd(30,100,10);
    return Qcalc('LROC\'s narrow camera sees about 10 microradians (0.00001 rad) per pixel. What is its resolution in METRES per pixel from '+h+' km altitude? (2 decimals)',h*1000*1e-5,'m',{hint:'Convert km to metres, then multiply by 0.00001.',formula:'resolution = altitude × pixel angle'});},
  ()=>{const r=rnd(10,100,10),t=rnd(10,60,10);
    return Qcalc('An instrument produces '+r+' Mbit/s for '+t+' minutes. How many gigabytes (GB) is that? (1 GB = 1000 MB, 8 bits = 1 byte, 2 decimals)',r*t*60/8/1000,'GB',{hint:'Mbit/s × seconds = Mbit. ÷ 8 gives MB. ÷ 1000 gives GB.',formula:'GB = rate × time ÷ 8 ÷ 1000'});},
  ()=>{const T=rnd(100,125,5),orbits=27.32*1440/T,circ=2*Math.PI*QM.R;
    return Qcalc('The Moon turns once in 27.32 days while LRO orbits every '+T+' minutes. How far (km) does the ground track shift at the equator between orbits? (1 decimal; Moon circumference = 2π × 1737.4 km)',circ/orbits,'km',{hint:'Orbits per Moon turn = 27.32 × 1440 ÷ T. Then circumference ÷ orbits.',formula:'shift = 2πR ÷ (27.32 × 1440 ÷ T)'});},
  instrQ,
  ()=>Qmc('Why does LRO use a polar orbit?','The Moon turns beneath it, so it eventually sees everywhere',['To stay over one spot forever','To avoid the Sun','To be nearer to Earth','Because the equator has no craters'],{hint:'Think about what happens while the Moon spins.',explain:'In a polar orbit the Moon rotates underneath, so the ground track gradually covers the whole surface.'}),
  ()=>Qthink('You can image only ONE region this month. Which do you prioritise?',[
    {t:'South-pole shadowed craters (possible water ice).',score:3,fb:'Great: water is a key resource for future explorers.'},
    {t:'A proposed landing site for the next mission.',score:3,fb:'Also excellent: landing-site safety is a core LRO job.'},
    {t:'A random mid-latitude plain.',score:1,fb:'Useful for coverage, but lower priority right now.'},
    {t:'The same crater you already mapped.',score:0,fb:'Repeating work wastes limited time.'}]),
  ()=>Qthink('The spacecraft enters safe mode during mapping. First move?',[
    {t:'Check telemetry, find the cause, recover step by step.',score:3,fb:'Calm, methodical recovery is how real teams do it.'},
    {t:'Immediately restart everything.',score:1,fb:'You could erase clues or repeat the fault.'},
    {t:'Wait a day without looking.',score:0,fb:'A drifting spacecraft needs attention.'},
    {t:'Stay in safe mode while protecting power and temperature, and plan to resume.',score:2,fb:'Safe, but plan to resume science soon.'}])
 ],
 /* ---------- Mission 5: Landing site ---------- */
 [
  ()=>{const K=rnd(25,40,1);
    return Qcalc('Diviner measured a very cold crater floor at '+K+' kelvin. What is that in °C? (1 decimal)',K-273.15,'°C',{tol:0.002,hint:'Subtract 273.15 from the kelvin value.',formula:'°C = K − 273.15'});},
  ()=>{const t=rnd(300,400,10);
    return Qcalc('LOLA\'s laser pulse takes '+t+' microseconds for the round trip. How high is the spacecraft, in km? (c = 299,792 km/s, 2 decimals)',QM.C*t*1e-6/2,'km',{tol:0.02,hint:'Microseconds to seconds (× 0.000001). Distance = c × t, then ÷ 2 because the light goes there and back.',formula:'height = c × t ÷ 2'});},
  ()=>Qmc('Which crater did the LCROSS impact target in 2009?','Cabeus',['Tycho','Copernicus','Hermite','Shackleton Rim only'],{hint:'It is near the lunar south pole.',explain:'The LCROSS rocket stage hit Cabeus on 9 October 2009.'}),
  ()=>Qmc('What has LRO photographed at the Apollo sites?','Descent stages, tracks and footpaths',['Alien buildings','Active rovers','Waving flags','Nothing at all'],{hint:'Evidence left behind by astronauts.',explain:'LRO images show hardware and tracks from the Apollo missions.'}),
  instrQ,
  ()=>Qthink('Cold polar craters may hold water ice. Which plan helps future explorers most?',[
    {t:'Combine LEND, LAMP and Diviner to confirm the ice and its temperature.',score:3,fb:'Multi-instrument evidence is the strongest case.'},
    {t:'Use only the camera.',score:1,fb:'Pictures alone cannot prove ice.'},
    {t:'Assume it is there and plan a base.',score:0,fb:'Plans must follow evidence.'},
    {t:'Rank crater sites by sunlight, temperature and slope.',score:3,fb:'Smart site selection!'}]),
  ()=>Qthink('A new landing site looks scientifically exciting but has steep, bouldery ground. What do you tell mission planners?',[
    {t:'Share a risk map and suggest a safer spot nearby.',score:3,fb:'Balancing science and safety is exactly what LRO data is for.'},
    {t:'Approve it. Science is worth any risk.',score:0,fb:'Crew and lander safety come first.'},
    {t:'Reject every site with boulders.',score:1,fb:'Too strict. Small adjustments may work.'},
    {t:'Ask for a higher-resolution image first.',score:3,fb:'More data before a decision is wise.'}])
 ]
];

/* One multiple-choice, one calculation and one think question (or the best available mix). */
function buildChallenge(i){
  const seen=new Set(), all=QPOOLS[i].map(g=>g()).filter(q=>!seen.has(q.q)&&seen.add(q.q));
  const by=t=>shuffle(all.filter(q=>q.type===t)), calcs=by('calc'), thinks=by('think'), mcs=by('mc');
  const out=[]; if(mcs[0])out.push(mcs[0]); if(calcs[0])out.push(calcs[0]); if(thinks[0])out.push(thinks[0]);
  const rest=shuffle([].concat(mcs.slice(1),calcs.slice(1),thinks.slice(1)));
  while(out.length<3&&rest.length)out.push(rest.shift());
  const rank={mc:0,calc:1,think:2}; return out.sort((a,b)=>rank[a.type]-rank[b.type]);
}

<script>
/* LRO Mission Control V5 - app layer
   Accounts, profiles, NASA library, Shop (accessories / tools / top-up) with ONE currency (points), AstroPeers + Chat,
   Challenge Calculator, dark/light theme, home mascot with comic speech bubble, and the shuffled music playlist. */

/* ---------- storage ---------- */
const memStore={};
const store={
  get(k,d){try{const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v;}catch(e){return k in memStore?memStore[k]:d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){memStore[k]=v;}},
  del(k){try{localStorage.removeItem(k);}catch(e){} delete memStore[k];}
};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okColor=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:'#b69cff';
function hashPw(email,pw){let x=5381; const s=email+'|'+pw; for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))>>>0; return x.toString(16);}

const DB={
  users(){return store.get('lromc_users',{});},
  me(){const e=store.get('lromc_session',null); return e?(this.users()[e]||null):null;},
  put(u){const all=this.users(); all[u.email]=u; store.set('lromc_users',all);},
  posts(){let p=store.get('lromc_posts',null); if(!p){p=SEED_POSTS.map(x=>Object.assign({},x)); store.set('lromc_posts',p);} return p;},
  chats(){let c=store.get('lromc_chats',null); if(!c){c=JSON.parse(JSON.stringify(SEED_CHATS)); store.set('lromc_chats',c);} return c;},
  custom(){return store.get('lromc_lib',[]);},
  lib(){return LIB_SEED.concat(this.custom());}
};
const ME=()=>DB.me();
const saveMe=m=>DB.put(m);
const isPro=()=>{const m=ME(); return !!(m&&m.sub&&m.sub.until>Date.now());};
function newUser(email,name,pw){
  return {email,name,pw:hashPw(email,pw),avatar:AVATARS[0],color:COLORS[0],bio:'',points:300,stars:[0,0,0,0,0],levels:[1,1,1,1,1],unlocked:0,
    tools:{hint:2,fifty:1,shield:1,double:1},sub:null,owned:[],equip:{hat:'',frame:'',theme:''},best:[0,0,0,0,0],topups:[],following:[],joined:Date.now()};
}
function ensureUserFields(m){
  if(!m)return null;
  if(!m.equip)m.equip={hat:'',frame:'',theme:''};
  if(!m.levels)m.levels=[1,1,1,1,1];
  if(!m.owned)m.owned=[];
  if(!m.best)m.best=[0,0,0,0,0];
  if(!m.topups)m.topups=[];
  return m;
}
function avHTML(u,big){
  const eq=u.equip||{hat:u.hat||'',frame:u.frame||''};
  const cls='av'+(big?' big':'')+(eq.frame?' '+esc(eq.frame):'');
  const hat=eq.hat?'<i class="hat">'+esc(eq.hat)+'</i>':'';
  return '<span class="'+cls+'" style="background:'+okColor(u.color)+'">'+esc(u.avatar)+hat+'</span>';
}
function rankFor(totalPts){let r=CONTENT.ranks[0].name; CONTENT.ranks.forEach(x=>{if(totalPts>=x.min)r=x.name;}); return r;}
function loadProgress(){
  const m=ensureUserFields(ME());
  G.stars=m?m.stars.slice():[0,0,0,0,0];
  G.levels=m?m.levels.slice():[1,1,1,1,1];
  G.best=m?m.best.slice():[0,0,0,0,0];
  G.unlocked=m?m.unlocked:0;
  G.pts=[0,0,0,0,0];
}
function persistProgress(){
  const m=ensureUserFields(ME()); if(!m)return;
  m.stars=G.stars.slice(); m.best=G.best.slice(); m.levels=G.levels.slice(); m.unlocked=G.unlocked; saveMe(m);
}
function bank(v){const m=ME(); if(!m||!v)return; m.points+=v; saveMe(m);}

/* ---------- small UI helpers ---------- */
let toastT;
function toast(msg){const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400);}
function showInfo(html){$('infoSheet').innerHTML=html+'<div class="btnrow"><button class="btn yellow" id="infoOk">OK</button></div>'; $('info').hidden=false; $('infoOk').onclick=()=>{$('info').hidden=true;};}
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-t)/60000)); return m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago';};

/* ---------- navigation ---------- */
let panelBackFn=null;
function goTitle(){renderTitleTop(); showScreen('title');}
function openPanel(title,html,back,nav){
  panelBackFn=back||goTitle; $('panelTitle').textContent=title; const m=ME();
  $('panelNav').hidden=!nav; $('panelNav').innerHTML=nav||'';
  $('panelScore').hidden=!m; $('panelPts').textContent=m?m.points:0;
  $('panelBody').innerHTML=html; $('panelBody').scrollTop=0; showScreen('panel');
}
const NEEDS_LOGIN=['play','peers','shop','pro','profile','upload'];
let afterLogin=null;
function go(target,back){
  if(NEEDS_LOGIN.includes(target)&&!ME()){afterLogin=target; return panelLogin('Log in or sign up to continue.');}
  const f={title:goTitle,play:goMap,library:panelLibrary,manual:panelManual,peers:panelPeers,shop:panelShop,pro:panelPro,profile:panelProfile,upload:panelUpload,login:panelLogin}[target]||goTitle;
  f(back);
}
function renderTitleTop(){
  const m=ensureUserFields(ME());
  $('titleTop').innerHTML=m
   ?(isPro()?'<span class="pill pro">PRO</span>':'')+'<button class="chipbtn" data-go="profile" aria-label="Open profile, '+m.points+' points">'+avHTML(m,false)+m.points+' pts</button>'
   :'<button class="btn sm yellow" data-go="login">Login / Sign up</button>';
}

/* ---------- helper tools ---------- */
const toolCount=id=>{const m=ME(); return m?(m.tools[id]||0):0;};
const has=id=>isPro()||toolCount(id)>0;
function spend(id){if(isPro())return true; const m=ME(); if(!m||(m.tools[id]||0)<=0)return false; m.tools[id]--; saveMe(m); return true;}
function toolsHTML(){
  return SHOP.tools.map(t=>{
    const act=(t.id==='shield'&&G.shield)||(t.id==='double'&&G.dbl), tip=esc(t.name+': '+t.desc);
    return '<button class="tbtn'+(act?' act':'')+(has(t.id)?'':' empty')+'" data-tool="'+t.id+'" title="'+tip+'" aria-label="'+tip+'"><span class="ti">'+t.icon+'</span><span class="tn">'+t.short+'</span><span class="cnt">'+(isPro()?'∞':toolCount(t.id))+'</span></button>';
  }).join('');
}
function renderTools(){
  $('tools').innerHTML=toolsHTML();
  const q=$('qtools'); if(q)q.innerHTML=toolsHTML();
}
const noTool=()=>toast('None left. Buy more in the Shop or go Pro for unlimited.');
function useTool(id){
  const inQuiz=!$('quiz').hidden;
  if(!inQuiz&&(G.screen!=='play'||G.demo||G.paused))return;
  if(!ME())return;
  if(id==='shield'){
    if(G.shield)return toast('Shield is already on.'); if(!spend('shield'))return noTool();
    G.shield=true; toast('🛡️ Shield on: your next mistake is forgiven.'); renderTools(); return;
  }
  if(id==='double'){
    if(G.dbl)return toast('Double Points is already on.'); if(!spend('double'))return noTool();
    G.dbl=true; toast('⚡ Double Points: points are doubled this mission!'); renderTools(); return;
  }
  if(!has(id))return noTool();
  if(id==='hint'){
    if(inQuiz){if(!qHint())return;}
    else{const msg=STAGES[G.cur].hint&&STAGES[G.cur].hint(); if(!msg)return toast('No hint needed right now.'); say(msg,'good');}
  }
  if(id==='fifty'){
    if(inQuiz){if(!qFifty())return;}
    else{
      const S=STAGES[G.cur]; if(!S.fifty)return toast('50/50 works in Mission 4 and in the Mission Challenge.');
      const msg=S.fifty(); if(!msg)return toast('Wait for a target inside the scan window.'); say(msg,'good');
    }
  }
  spend(id); renderTools();
}
$('tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]'); if(b)useTool(b.dataset.tool);});

/* ---------- Mission Challenge + Built-in Scientific Calculator ---------- */
const Q={mi:0,stars:0,list:[],i:0,earned:0,good:0,done:false,hint:false,fifty:false,calcExpr:'',calcOpen:true};
const QTYPE={mc:'📘 Multiple choice',calc:'🧮 Calculate it',think:'🧠 Think outside the box'};
function startChallenge(mi,stars){
  persistProgress(); bank(G.pts[mi]);
  Q.mi=mi; Q.stars=stars; Q.list=buildChallenge(mi); Q.i=0; Q.earned=0; Q.good=0;
  $('result').hidden=true; renderQ(); $('quiz').hidden=false;
}
function evalCalcExpr(expr){
  if(!expr)return '';
  const s=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/π/g,'Math.PI')
    .replace(/√\(/g,'Math.sqrt(').replace(/ln\(/g,'Math.log(').replace(/\^/g,'**');
  if(/[^0-9+\-*/().MathPIsqrtlog,\s]/.test(s))throw 0;
  const v=Function('"use strict";return ('+s+')')();
  if(typeof v!=='number'||!isFinite(v))throw 0;
  return +v.toFixed(4);
}
function calcHTML(){
  const btns=[
    ['ln(','fn'],['√(','fn'],['^','fn'],['(','fn'],[')','fn'],
    ['7',''],['8',''],['9',''],['÷','op'],['C','op'],
    ['4',''],['5',''],['6',''],['×','op'],['⌫','op'],
    ['1',''],['2',''],['3',''],['-','op'],['π','fn'],
    ['0',''],['.',''],['R','fn'],['GM','fn'],['+','op']
  ];
  return '<div class="calc-box" id="calcBox"'+(Q.calcOpen?'':' hidden')+'>'
    +'<div class="calc-disp" id="calcDisp">'+(esc(Q.calcExpr)||'0')+'</div>'
    +'<div class="calc-grid">'+btns.map(b=>'<button type="button" class="cbtn '+b[1]+'" data-calc="'+b[0]+'">'+b[0]+'</button>').join('')+'</div>'
    +'<div class="row"><button type="button" class="btn sm ok" style="flex:1" data-calc="=">= Calculate</button><button type="button" class="btn sm yellow" style="flex:1" data-calc="use">⬆ Use Answer</button></div>'
    +'</div>';
}
function renderQ(){
  const q=Q.list[Q.i]; Q.done=false; Q.hint=false; Q.fifty=false; Q.calcExpr=''; let ans='';
  if(q.type==='calc'){
    ans='<div class="qrow"><input id="qnum" class="fld" inputmode="decimal" autocomplete="off" placeholder="Your answer'+(q.unit?' ('+esc(q.unit)+')':'')+'"><button class="btn sm yellow" id="qcalcBtn" type="button">🧮 Calc</button><button class="btn pink" id="qgo">Check</button></div>'+calcHTML();
  } else {
    ans=q.options.map((o,k)=>'<button class="qopt" data-k="'+k+'">'+esc(o.t)+'</button>').join('');
  }
  $('quizSheet').innerHTML='<div class="dt">Mission '+(Q.mi+1)+' challenge · question '+(Q.i+1)+' of '+Q.list.length+'</div><div class="qtype">'+QTYPE[q.type]+'</div>'
   +'<h3 class="qtext">'+esc(q.q)+'</h3>'+(q.type==='think'?'<div class="small">There is no single right answer. Pick the best trade-off.</div>':'')
   +'<div id="qformula" hidden></div><div id="qans">'+ans+'</div><div id="qhint"></div><div id="qfb"></div>'
   +'<div class="tools full" id="qtools"></div><div class="btnrow"><button class="btn sm" id="qskip">Skip the rest</button></div>';
  renderTools();
  if(q.type==='calc')$('qnum').addEventListener('keydown',e=>{if(e.key==='Enter')qAnswerCalc();});
}
function handleCalcKey(k){
  if(k==='C')Q.calcExpr='';
  else if(k==='⌫')Q.calcExpr=Q.calcExpr.slice(0,-1);
  else if(k==='R')Q.calcExpr+='1737.4';
  else if(k==='GM')Q.calcExpr+='4902.8';
  else if(k==='='){
    try{Q.calcExpr=String(evalCalcExpr(Q.calcExpr));}catch(e){toast('Check parentheses or operators.');}
  } else if(k==='use'){
    try{
      const val=evalCalcExpr(Q.calcExpr);
      if(val===''||isNaN(val))return toast('Calculate a number first.');
      Q.calcExpr=String(val);
      if($('qnum'))$('qnum').value=String(rd(+val,2));
      toast('Copied '+rd(+val,2)+' to answer box!');
    }catch(e){toast('Complete the expression first.');}
  } else {
    Q.calcExpr+=k;
  }
  const d=$('calcDisp'); if(d)d.textContent=Q.calcExpr||'0';
}
function qHint(){
  const q=Q.list[Q.i]; if(Q.done){toast('Already answered.'); return false;} if(Q.hint){toast('Hint already shown.'); return false;}
  Q.hint=true; $('qhint').innerHTML='<div class="qfb hint">💡 '+esc(q.hint||'Think about the key idea.')+'</div>';
  if(q.formula){const f=$('qformula'); f.hidden=false; f.className='formula'; f.textContent=q.formula;} return true;
}
function qFifty(){
  const q=Q.list[Q.i]; if(Q.done||q.type!=='mc'){toast('50/50 works on multiple-choice questions.'); return false;} if(Q.fifty){toast('Already used.'); return false;}
  Q.fifty=true; shuffle([...document.querySelectorAll('#qans .qopt')].filter(b=>!q.options[+b.dataset.k].ok)).slice(0,2).forEach(b=>b.classList.add('gone')); return true;
}
function useShieldRetry(btn,msg){
  G.shield=false; renderTools(); if(btn)btn.disabled=true;
  $('qfb').innerHTML='<div class="qfb bad">🛡️ <b>Shield used.</b> '+msg+'</div>';
}
function qAnswerOpt(k){
  if(Q.done)return; const q=Q.list[Q.i], o=q.options[k], btn=document.querySelector('#qans .qopt[data-k="'+k+'"]');
  if(q.type==='mc'){
    if(o.ok){btn.classList.add('ok'); return qResolve(3,'✅ <b>Correct!</b> '+esc(q.explain||''));}
    if(G.shield)return useShieldRetry(btn,'Not that one. Try again!');
    btn.classList.add('bad'); document.querySelectorAll('#qans .qopt').forEach(b=>{if(q.options[+b.dataset.k].ok)b.classList.add('ok');});
    return qResolve(0,'❌ '+esc(q.explain||''));
  }
  if(o.score===0&&G.shield)return useShieldRetry(btn,'That choice is risky. Try another!');
  document.querySelectorAll('#qans .qopt').forEach(b=>{if(q.options[+b.dataset.k].score===3)b.classList.add('ok');});
  btn.classList.remove('ok'); btn.classList.add(o.score>=2?'ok':o.score===1?'half':'bad');
  qResolve(o.score,(o.score>=2?'🌟 ':o.score===1?'🤔 ':'❌ ')+esc(o.fb)+'<br><span class="small">The best trade-offs are green. There can be more than one good answer.</span>');
}
function qAnswerCalc(){
  if(Q.done)return; const q=Q.list[Q.i], n=parseFloat($('qnum').value.replace(',','.'));
  if(isNaN(n))return toast('Type a number first.');
  const ok=Math.abs(n-q.answer)<=Math.abs(q.answer)*q.tol+1e-9;
  if(ok)return qResolve(3,'✅ <b>Correct!</b> '+(q.formula?'Formula: '+esc(q.formula)+'.':''));
  if(G.shield)return useShieldRetry(null,'Not quite. Check your formula and try again!');
  const shown=Math.abs(q.answer)<1?rd(q.answer,3):rd(q.answer,2);
  qResolve(0,'❌ The answer is about <b>'+shown+' '+esc(q.unit||'')+'</b> (within '+q.tol*100+'% counts). '+(q.formula?'Formula: '+esc(q.formula)+'.':''));
}
function qResolve(score,fb){
  Q.done=true; const q=Q.list[Q.i]; const base=q.type==='think'?[0,40,80,120][score]:(score>=2?100:0);
  let gain=base; if(G.dbl&&gain)gain*=2; if(base>0)Q.good++;
  Q.earned+=gain; G.pts[Q.mi]+=gain; bank(gain); $('score').textContent=total();
  document.querySelectorAll('#qans .qopt,#qgo,#qnum').forEach(e=>{e.disabled=true;});
  const last=Q.i===Q.list.length-1;
  $('qfb').innerHTML='<div class="qfb '+(score>=2?'good':score===1?'':'bad')+'">'+fb+'<br><b>+'+gain+' points'+(G.dbl&&gain?' (⚡ doubled)':'')+'</b></div><div class="btnrow" style="margin-top:8px"><button class="btn pink" id="qnext">'+(last?'See results':'Next question')+'</button></div>';
  renderTools();
}
function finishChallenge(){$('quiz').hidden=true; showResult(Q.stars);}
$('quizSheet').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t)return;
  if(t.dataset.calc)return handleCalcKey(t.dataset.calc);
  if(t.id==='qcalcBtn'){Q.calcOpen=!Q.calcOpen; const cb=$('calcBox'); if(cb)cb.hidden=!Q.calcOpen; return;}
  if(t.dataset.tool)return useTool(t.dataset.tool);
  if(t.classList.contains('qopt'))return qAnswerOpt(+t.dataset.k);
  if(t.id==='qgo')return qAnswerCalc();
  if(t.id==='qnext'){if(Q.i<Q.list.length-1){Q.i++; renderQ();} else finishChallenge(); return;}
  if(t.id==='qskip')return finishChallenge();
});

/* =====================================================================
   V5: MUSIC PLAYLIST  -  audio1.mp3 to audio4.mp3, shuffled, looping.
   Put the four files in the same folder as this page. Browsers only allow sound after a first tap,
   so playback starts on the player's first touch or click.
   ===================================================================== */
const PLAYLIST=['Astral Chime.mp3','Dreamlike Reflection.mp3','Lustrous Stars.mp3','Soothing Nightfall.mp3'].map(src=>({src,name:src.replace('.mp3','')}));
const MUSIC={
  a:new Audio(), order:[], pos:-1, cur:-1, fails:0, dead:false, unlocked:false, sheet:false,
  p:Object.assign({on:true,shuffle:true,loop:true,vol:.4,voice:false},store.get('lromc_audio',{})),
  save(){store.set('lromc_audio',this.p);},
  playing(){return !this.a.paused&&!this.a.ended&&this.cur>=0;},
  build(avoid){
    let o=PLAYLIST.map((_,i)=>i); if(this.p.shuffle)o=shuffle(o);
    if(avoid!=null&&avoid>=0&&o.length>1&&o[0]===avoid){const k=1+Math.floor(Math.random()*(o.length-1)); [o[0],o[k]]=[o[k],o[0]];}   // never repeat the same song back to back
    this.order=o; this.pos=-1;
  },
  load(){
    const i=this.order[this.pos]; this.cur=i; this.a.src=PLAYLIST[i].src; this.a.volume=this.p.vol;
    const pr=this.a.play(); if(pr&&pr.catch)pr.catch(e=>this.blocked(e)); this.ui();
  },
  blocked(e){ if(e&&e.name==='NotAllowedError'){this.unlocked=false;} },
  next(){
    if(!this.order.length)this.build(this.cur);
    this.pos++;
    if(this.pos>=this.order.length){
      if(!this.p.loop){this.pos=this.order.length-1; this.a.pause(); this.ui(); return;}
      this.build(this.cur); this.pos=0;                                   // loop: reshuffle and go again
    }
    this.load();
  },
  prev(){ if(this.a.currentTime>3||this.pos<=0){this.a.currentTime=0; if(this.a.paused)this.resume(); return;} this.pos--; this.load(); },
  playTrack(i){ this.order=[i].concat(shuffle(PLAYLIST.map((_,k)=>k).filter(k=>k!==i))); if(!this.p.shuffle)this.order=PLAYLIST.map((_,k)=>(i+k)%PLAYLIST.length); this.pos=0; this.p.on=true; this.dead=false; this.fails=0; this.save(); this.load(); },
  resume(){
    this.p.on=true; this.save(); this.dead=false; this.fails=0;
    if(this.cur<0||!this.a.src)this.next(); else {const pr=this.a.play(); if(pr&&pr.catch)pr.catch(e=>this.blocked(e));}
    this.ui();
  },
  pause(){this.p.on=false; this.save(); this.a.pause(); this.ui();},
  toggle(){this.playing()?this.pause():this.resume();},
  kick(){ if(this.unlocked||!this.p.on||this.dead)return; this.unlocked=true; this.resume(); },   // first gesture starts the music
  setVol(v){this.p.vol=clamp(v,0,1); this.a.volume=this.p.vol; this.save();},
  status(){return this.dead?'Audio files not found':this.playing()?'Playing':'Paused';},
  ui(){
    const on=this.playing();
    document.querySelectorAll('[data-ui="music"]').forEach(b=>{b.textContent=on?'🎵':'🔇'; b.classList.toggle('on',on); const l=on?'Music playing. Open playlist controls':'Music off. Open playlist controls'; b.setAttribute('aria-label',l); b.title=l;});
    if(this.sheet)this.render();
  },
  open(){this.sheet=true; this.render(); $('music').hidden=false;},
  close(){this.sheet=false; $('music').hidden=true;},
  render(){
    const cur=this.cur>=0?PLAYLIST[this.cur].name:'Nothing yet', P=this.p;
    $('musicSheet').innerHTML='<div class="musichead"><h2>🎵 Mission playlist</h2><button class="rbtn" data-m="close" aria-label="Close">✕</button></div>'
     +'<div class="np"><small>'+this.status()+'</small><b>'+esc(cur)+'</b></div>'
     +(this.dead?'<div class="qfb bad">Could not load the songs. Place <b>audio1.mp3</b> to <b>audio4.mp3</b> in the same folder as this page, then press play.</div>':'')
     +'<div class="musrow"><button class="rbtn big" data-m="prev" aria-label="Previous">⏮</button><button class="rbtn big hero2" data-m="toggle" aria-label="'+(this.playing()?'Pause':'Play')+'">'+(this.playing()?'⏸':'▶')+'</button><button class="rbtn big" data-m="next" aria-label="Next">⏭</button></div>'
     +'<div class="chips" style="justify-content:center"><button class="chip'+(P.shuffle?' on':'')+'" data-m="shuffle" aria-pressed="'+P.shuffle+'">🔀 Shuffle '+(P.shuffle?'on':'off')+'</button><button class="chip'+(P.loop?' on':'')+'" data-m="loop" aria-pressed="'+P.loop+'">🔁 Loop '+(P.loop?'on':'off')+'</button><button class="chip'+(P.voice?' on':'')+'" data-m="voice" aria-pressed="'+P.voice+'">🗣️ Mascot voice '+(P.voice?'on':'off')+'</button></div>'
     +'<label class="lbl" for="musVol">Volume</label><input id="musVol" type="range" min="0" max="100" value="'+Math.round(P.vol*100)+'" aria-label="Music volume">'
     +'<ol class="tracks">'+PLAYLIST.map((t,i)=>'<li><button class="trackbtn'+(i===this.cur?' now':'')+'" data-m="track" data-i="'+i+'"><i>'+(i===this.cur&&this.playing()?'♪':(i+1))+'</i><span>'+esc(t.name)+'</span></button></li>').join('')+'</ol>';
  }
};
MUSIC.a.preload='auto';
MUSIC.a.addEventListener('ended',()=>MUSIC.next());
MUSIC.a.addEventListener('playing',()=>{MUSIC.fails=0; MUSIC.dead=false; MUSIC.ui();});
MUSIC.a.addEventListener('pause',()=>MUSIC.ui());
MUSIC.a.addEventListener('error',()=>{
  MUSIC.fails++;
  if(MUSIC.fails>=PLAYLIST.length){MUSIC.dead=true; MUSIC.a.removeAttribute('src'); MUSIC.cur=-1; MUSIC.ui(); toast('Playlist files not found. Put audio1.mp3 to audio4.mp3 next to the game.');}
  else MUSIC.next();                                                       // skip a missing or broken file
});
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>MUSIC.kick(),{capture:true,passive:true}));
$('musicSheet').addEventListener('click',e=>{
  const b=e.target.closest('[data-m]'); if(!b)return; const k=b.dataset.m, P=MUSIC.p;
  if(k==='close')return MUSIC.close();
  if(k==='toggle')MUSIC.toggle(); else if(k==='next'){MUSIC.p.on=true; MUSIC.next();} else if(k==='prev')MUSIC.prev();
  else if(k==='shuffle'){P.shuffle=!P.shuffle; MUSIC.save(); MUSIC.build(); if(MUSIC.cur>=0){MUSIC.order=[MUSIC.cur].concat(MUSIC.order.filter(x=>x!==MUSIC.cur)); MUSIC.pos=0;}}
  else if(k==='loop'){P.loop=!P.loop; MUSIC.save();}
  else if(k==='voice'){P.voice=!P.voice; MUSIC.save(); if(!P.voice&&window.speechSynthesis)speechSynthesis.cancel(); else MASCOT.say(MASCOT.pick(),true);}
  else if(k==='track')MUSIC.playTrack(+b.dataset.i);
  MUSIC.render();
});
$('musicSheet').addEventListener('input',e=>{if(e.target.id==='musVol')MUSIC.setVol(e.target.value/100);});
$('music').addEventListener('click',e=>{if(e.target===$('music'))MUSIC.close();});

/* =====================================================================
   V5: HOME MASCOT  -  Ro greets the player with comic speech-bubble lines (optionally spoken aloud)
   ===================================================================== */
const MASCOT={
  timer:null, last:'', shown:false,
  vars(){
    const m=ME(), nx=CONTENT.stages[Math.min(G.unlocked||0,CONTENT.stages.length-1)];
    return {name:m?m.name:'Astronaut', pts:m?m.points.toLocaleString():'0', next:nx.title};
  },
  fill(s){const v=this.vars(); return s.replace(/\{(\w+)\}/g,(_,k)=>esc(v[k]!=null?v[k]:''));},
  hello(){
    const h=new Date().getHours(), part=h<5?'night':h<12?'morning':h<18?'afternoon':h<22?'evening':'night';
    return {sfx:'HELLO!',t:CONTENT.mascot.hello[part]};
  },
  pick(){
    const inn=!!ME(), pool=CONTENT.mascot.lines.filter(l=>l.when==='any'||(l.when==='in'&&inn)||(l.when==='out'&&!inn));
    const fresh=pool.filter(l=>l.t!==this.last), src=fresh.length?fresh:pool;     // never the same line twice in a row
    return src[Math.floor(Math.random()*src.length)];
  },
  say(l,speak){
    const txt=this.fill(l.t); this.last=l.t;
    const box=$('comic'); $('comicTxt').innerHTML=txt; $('comicSfx').textContent=l.sfx||'HEY!';
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    if(speak||MUSIC.p.voice)this.speak(txt);
  },
  speak(html){
    if(!MUSIC.p.voice||!window.speechSynthesis)return;
    try{speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(html.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&')); u.rate=1.08; u.pitch=1.6; u.volume=.9; speechSynthesis.speak(u);}catch(e){}
  },
  start(){
    this.stop(); this.say(this.hello());
    this.timer=setInterval(()=>{if(!document.hidden)this.say(this.pick());},7500);
  },
  stop(){clearInterval(this.timer); this.timer=null; if(window.speechSynthesis)try{speechSynthesis.cancel();}catch(e){}},
  tap(){
    const b=$('mascotBtn'); b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); setTimeout(()=>b.classList.remove('hop'),560);
    this.say(this.pick(),true); clearInterval(this.timer); this.timer=setInterval(()=>{if(!document.hidden)this.say(this.pick());},7500);
  },
  sync(name){ if(name==='title'){ if(!this.timer)this.start(); } else if(this.timer)this.stop(); }
};
$('mascotBtn').addEventListener('click',()=>MASCOT.tap());

/* utility buttons (theme + music) work from any screen */
$('game').addEventListener('click',e=>{
  const b=e.target.closest('[data-ui]'); if(!b)return;
  if(b.dataset.ui==='theme')THEME.toggle(); else if(b.dataset.ui==='music')MUSIC.open();
});

/* ---------- wiring ---------- */
$('panelBack').addEventListener('click',()=>(panelBackFn||goTitle)());
$('mapBack').addEventListener('click',goTitle);
$('mapShop').addEventListener('click',()=>go('shop',goMap));
$('title').addEventListener('click',e=>{const t=e.target.closest('[data-go]'); if(t)go(t.dataset.go);});

loadProgress(); syncUI(); goTitle();

</script>
</body>
</html>
